name: Mark's AI offline APK build

on:
  push:
    paths:
      - 'Mark_s_AI_v2590_BUILD_FIX_2.zip'
      - 'tools/**'
      - '.github/workflows/offline-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project archive
        run: |
          test -s Mark_s_AI_v2590_BUILD_FIX_2.zip
          unzip -t Mark_s_AI_v2590_BUILD_FIX_2.zip | tail -n 2

      - name: Extract project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_BUILD_FIX_2.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android host
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Apply offline app repairs
        working-directory: app
        run: |
          python3 ../tools/apply_offline_patch_v2590.py
          python3 ../tools/v2624_raw_frame_video_renderer.py
          python3 ../tools/apply_offline_scene_art_v1.py
          dart format lib || true
          flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --verbose

      - name: Verify APK exists
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p build/install
          cp build/app/outputs/flutter-apk/app-debug.apk build/install/Marks-AI-Offline.apk
          sha256sum build/install/Marks-AI-Offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-Offline-APK
          path: app/build/install/Marks-AI-Offline.apk
          if-no-files-found: error
