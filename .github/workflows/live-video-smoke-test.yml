name: Mark's AI live Runway video smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-video-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require provider secret
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: |
          if [ -z "$RUNWAYML_API_SECRET" ]; then
            echo "::error::Repository secret RUNWAYML_API_SECRET is missing. Add it in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
      - name: Install media probe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate, poll, download and validate a real MP4
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { setTimeout: sleep } = require('node:timers/promises');
          const { registerVideoGenerationRoutes } = require('./tools/video_generation_routes');

          // Exercise the same route handlers used by the backend, while their
          // provider fetch calls go to the real Runway service.
          const routes = new Map();
          const app = {
            post(path, handler) { routes.set('POST ' + path, handler); },
            get(path, handler) { routes.set('GET ' + path, handler); }
          };
          registerVideoGenerationRoutes(app);

          async function call(method, path, { body = {}, params = {} } = {}) {
            const handler = routes.get(method + ' ' + path);
            if (!handler) throw new Error('Route not registered: ' + method + ' ' + path);
            const result = { code: 200, payload: undefined };
            const res = {
              status(code) { result.code = code; return this; },
              json(payload) { result.payload = payload; return this; }
            };
            await handler({ body, params }, res);
            if (result.code < 200 || result.code >= 300) {
              throw new Error(method + ' ' + path + ' returned HTTP ' + result.code + ': ' +
                JSON.stringify(result.payload).slice(0, 1200));
            }
            return result.payload;
          }

          function findUrl(value, depth = 0) {
            if (depth > 8) return null;
            if (typeof value === 'string') {
              try {
                const url = new URL(value.trim());
                return url.protocol === 'https:' && url.hostname ? url.toString() : null;
              } catch { return null; }
            }
            if (Array.isArray(value)) {
              for (const item of value) { const found = findUrl(item, depth + 1); if (found) return found; }
            }
            if (value && typeof value === 'object') {
              for (const key of ['url', 'uri', 'video_url', 'videoUrl', 'contentUrl', 'downloadUrl', 'output', 'outputs']) {
                const found = findUrl(value[key], depth + 1); if (found) return found;
              }
              for (const child of Object.values(value)) { const found = findUrl(child, depth + 1); if (found) return found; }
            }
            return null;
          }

          (async () => {
            console.log('Checking the actual video route health and credential configuration.');
            const health = await call('GET', '/api/video/health');
            if (health.provider !== 'runway' || health.model !== 'gen4.5' || health.generationReady !== true) {
              throw new Error('Video health route reports generation is not ready: ' + JSON.stringify(health));
            }

            console.log('Submitting minimal 2-second text-to-video request through the backend route.');
            const submitted = await call('POST', '/api/video/generate', {
              body: {
                prompt: 'A simple red paper kite drifting slowly across a clear blue sky, stable camera, no text.',
                aspectRatio: '16:9',
                durationSeconds: 2
              }
            });
            const taskId = submitted.taskId || submitted.jobId;
            if (typeof taskId !== 'string' || !taskId.trim()) {
              throw new Error('Backend route did not return a usable task ID.');
            }
            console.log('Backend accepted task; ID recorded (not a secret): ' + taskId);
            const deadline = Date.now() + 10 * 60 * 1000;
            let task;
            while (Date.now() < deadline) {
              await sleep(5000);
              task = await call('GET', '/api/video/status/:taskId', { params: { taskId } });
              console.log('Backend-normalized task status: ' + String(task.status || 'MISSING'));
              if (task.status === 'SUCCEEDED') break;
              if (['FAILED', 'CANCELED', 'CANCELLED', 'ERROR'].includes(String(task.status).toUpperCase())) {
                throw new Error('Provider task ended ' + task.status + ': ' +
                  JSON.stringify(task.failureMessage || task.failureCode || task.failure || task));
              }
            }
            if (!task || task.status !== 'SUCCEEDED') throw new Error('Timed out waiting for provider video generation.');
            const videoUrl = findUrl(task.output);
            if (!videoUrl) throw new Error('Backend status route returned success without a usable HTTPS video URL.');
            const videoResponse = await fetch(videoUrl, { signal: AbortSignal.timeout(120000) });
            if (!videoResponse.ok) throw new Error('Video download failed with HTTP ' + videoResponse.status);
            const bytes = Buffer.from(await videoResponse.arrayBuffer());
            if (bytes.length < 1024 || bytes.toString('ascii', 4, 8) !== 'ftyp') {
              throw new Error('Downloaded output is not a valid MP4 (missing ftyp signature or too small).');
            }
            fs.writeFileSync('runway-smoke-test.mp4', bytes);
            fs.writeFileSync('runway-smoke-test.txt', [
              'result=PASS',
              'provider=Runway',
              'test_path=backend-route-handlers',
              'task_id=' + taskId,
              'task_status=' + task.status,
              'mp4_bytes=' + bytes.length,
              'mp4_signature=' + bytes.toString('ascii', 4, 8)
            ].join('\\n') + '\\n');
            console.log('PASS: real provider task succeeded through backend route handlers; MP4 downloaded and ftyp signature verified (' + bytes.length + ' bytes).');
          })().catch(error => { console.error('LIVE VIDEO SMOKE TEST FAILED:', error.message); process.exitCode = 1; });
          NODE
      - name: Verify playable video stream and duration
        run: |
          set -euo pipefail
          test -s runway-smoke-test.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json runway-smoke-test.mp4 | tee runway-smoke-test-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runway-smoke-test-probe.json').read_text())
          streams = report.get('streams', [])
          fmt = report.get('format', {})
          assert streams, 'Downloaded MP4 has no decodable video stream'
          assert int(streams[0].get('width', 0)) > 0 and int(streams[0].get('height', 0)) > 0, 'Video stream has invalid dimensions'
          duration = float(fmt.get('duration', 0))
          assert duration > 0, 'Video duration is missing or zero'
          with Path('runway-smoke-test.txt').open('a') as f:
              f.write(f'video_codec={streams[0].get("codec_name", "unknown")}\n')
              f.write(f'video_width={streams[0]["width"]}\nvideo_height={streams[0]["height"]}\n')
              f.write(f'duration_seconds={duration:.3f}\n')
          print(f'PASS: playable video stream {streams[0].get("codec_name")} {streams[0]["width"]}x{streams[0]["height"]}, duration {duration:.3f}s')
          PY
      - name: Upload generated MP4 and smoke-test report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-Live-Video-Smoke-Test
          path: |
            runway-smoke-test.mp4
            runway-smoke-test.txt
          if-no-files-found: error
