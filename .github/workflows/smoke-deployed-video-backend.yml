name: Mark's AI deployed video backend smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend URL configuration
        env:
          VIDEO_BACKEND_URL: ${{ secrets.VIDEO_BACKEND_URL }}
        run: |
          if [ -z "$VIDEO_BACKEND_URL" ]; then
            echo "::error::Repository secret VIDEO_BACKEND_URL is missing. Add the deployed backend base URL in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Install MP4 media probe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check deployed video API and optionally generate a real clip
        env:
          VIDEO_BACKEND_URL: ${{ secrets.VIDEO_BACKEND_URL }}
          VIDEO_GENERATION_SMOKE_PROMPT: ${{ secrets.VIDEO_GENERATION_SMOKE_PROMPT }}
          VIDEO_SMOKE_TIMEOUT_MS: '600000'
        run: node tools/smoke_video_generation_backend.js
      - name: Verify generated MP4 is playable
        if: success() && hashFiles('video-backend-smoke-test.mp4') != ''
        run: |
          set -euo pipefail
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json video-backend-smoke-test.mp4 | tee video-backend-smoke-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('video-backend-smoke-probe.json').read_text())
          streams = report.get('streams', [])
          fmt = report.get('format', {})
          assert streams, 'Generated MP4 has no decodable video stream'
          assert int(streams[0].get('width', 0)) > 0 and int(streams[0].get('height', 0)) > 0, 'Generated video dimensions are invalid'
          duration = float(fmt.get('duration', 0))
          assert duration > 0, 'Generated video duration is missing or zero'
          with Path('video-backend-smoke-test.txt').open('a') as f:
              f.write(f'video_codec={streams[0].get("codec_name", "unknown")}\n')
              f.write(f'video_width={streams[0]["width"]}\nvideo_height={streams[0]["height"]}\n')
              f.write(f'duration_seconds={duration:.3f}\n')
          print(f'PASS: playable stream {streams[0].get("codec_name")} {streams[0]["width"]}x{streams[0]["height"]}, duration {duration:.3f}s')
          PY
      - name: Upload live-generation evidence
        if: success() && hashFiles('video-backend-smoke-test.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-Deployed-Video-Backend-Smoke-Test
          path: |
            video-backend-smoke-test.mp4
            video-backend-smoke-test.txt
            video-backend-smoke-probe.json
          if-no-files-found: error
