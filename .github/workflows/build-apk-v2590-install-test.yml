name: Mark's AI v2590 INSTALL TEST APK

on:
  push:
    paths:
      - 'Mark_s_AI_v2590_BUILD_FIX_2.zip'
      - '.github/workflows/build-apk-v2590-install-test.yml'
      - 'tools/apply_offline_scene_art_v1.py'
      - 'tools/v2624_raw_frame_video_renderer.py'
      - 'tools/apply_offline_patch_v2590.py'
      - 'tools/apply_local_animatic_renderer.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract BUILD FIX 2 project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_BUILD_FIX_2.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android host
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Apply offline Film Creator patch
        working-directory: app
        run: |
          python3 ../tools/apply_offline_patch_v2590.py
          grep -RIl --exclude-dir=.git '10.0.2.2:3000/api/projects' . | while IFS= read -r f; do
            sed -i 's#10\\.0\\.2\\.2:3000/api/projects#offline://projects#g' "$f"
          done
          if grep -RIl --exclude-dir=.git '10.0.2.2:3000/api/projects' .; then
            echo 'ERROR: stale Film Creator endpoint remains.'
            exit 1
          fi
          dart format lib || true

      - name: Repair known broken Dart screens
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('lib')
          replacements = {
            'film_library_screen.dart': """import 'package:flutter/material.dart';
class FilmLibraryScreen extends StatelessWidget {
  const FilmLibraryScreen({super.key});
  @override Widget build(BuildContext context) => Scaffold(
    appBar: AppBar(title: const Text('Film Library')),
    body: const Center(child: Text('Your films will appear here.')),
  );
}
""",
            'release_build_center_screen.dart': """import 'package:flutter/material.dart';
class ReleaseBuildCenterScreen extends StatelessWidget {
  const ReleaseBuildCenterScreen({super.key});
  @override Widget build(BuildContext context) => Scaffold(
    appBar: AppBar(title: const Text('Release Build Center')),
    body: const Center(child: Text('Release tools ready.')),
  );
}
""",
            'film_projects_screen.dart': """import 'package:flutter/material.dart';
class FilmProjectsScreen extends StatelessWidget {
  const FilmProjectsScreen({super.key});
  @override Widget build(BuildContext context) => Scaffold(
    appBar: AppBar(title: const Text('Film Projects')),
    body: const Center(child: Text('Your projects are stored on this phone.')),
  );
}
""",
            'shot_cards_screen.dart': """import 'package:flutter/material.dart';
class ShotCardsScreen extends StatelessWidget {
  const ShotCardsScreen({super.key});
  @override Widget build(BuildContext context) => Scaffold(
    appBar: AppBar(title: const Text('Shot Cards')),
    body: const Center(child: Text('Shot cards')),
  );
}
""",
            'smart_clip_review_screen.dart': """import 'package:flutter/material.dart';
class SmartClipReviewScreen extends StatelessWidget {
  const SmartClipReviewScreen({super.key});
  @override Widget build(BuildContext context) => Scaffold(
    appBar: AppBar(title: const Text('Smart Clip Review')),
    body: const Center(child: Text('Smart clip review')),
  );
}
""",
            'timeline_audio_panel.dart': """import 'package:flutter/material.dart';
class TimelineAudioPanel extends StatelessWidget {
  const TimelineAudioPanel({super.key});
  @override Widget build(BuildContext context) => const SizedBox.shrink();
}
""",
          }
          for name, body in replacements.items():
            p = lib / name
            if p.exists():
              p.write_text(body)
          PY
          # This legacy package has unrelated malformed screens. Format only the
          # Film Creator and video-generation paths used by this install test.
          for file in \
            lib/film_creator_screen.dart \
            lib/scene_prompt_screen.dart \
            lib/local_video_studio_screen.dart \
            lib/film_assembly_screen.dart \
            lib/video_generation_status_screen.dart \
            lib/screenplay_screen.dart; do
            if [ -f "$file" ]; then dart format "$file"; fi
          done

      - name: Apply and verify raw-frame video renderer repair
        working-directory: app
        run: |
          python3 ../tools/apply_local_animatic_renderer.py
          grep -Fq 'LOCAL_VIDEO_STAGE: drawing_frames' lib/local_video_studio_screen.dart
          grep -Fq 'frames.rgba' lib/local_video_studio_screen.dart
          grep -Fq -- '-f rawvideo -pixel_format rgba -video_size 640x360' lib/local_video_studio_screen.dart
          echo 'Renderer patch applied and source guards passed.'

      - name: Add offline prompt-driven scene artwork
        working-directory: app
        run: python3 ../tools/apply_offline_scene_art_v1.py

      - name: Build DEBUG APK for direct installation
        working-directory: app
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          if strings build/app/outputs/flutter-apk/app-debug.apk | grep -Fq '10.0.2.2:3000/api/projects'; then
            echo 'ERROR: old Film Creator network endpoint remains.'
            exit 1
          fi
          mkdir -p build/install
          cp build/app/outputs/flutter-apk/app-debug.apk build/install/Mark_s_AI_v2590_INSTALL_TEST.apk
          sha256sum build/install/Mark_s_AI_v2590_INSTALL_TEST.apk

      - name: Upload install-test APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-INSTALL-TEST-APK
          path: app/build/install/Mark_s_AI_v2590_INSTALL_TEST.apk
          if-no-files-found: error
