name: Build Mark's AI APK v2590 REPAIR07

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk-repair.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract v2590 project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart compiler errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # v2590 compile repair: video_generation_status_screen.dart
          p = Path('lib/video_generation_status_screen.dart')
          s = p.read_text()
          s = re.sub(r'\bNumber\s*\(\s*d\s*\[\s*([\'\"])([^\'\"]+)\1\s*\]\s*\)', r'_number(d[\1\2\1])', s)
          if 'num _number(dynamic x)' not in s:
              s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
          p.write_text(s)

          # v2590 compile repair: malformed shot list cast in shot_cards_screen.dart
          p = Path('lib/shot_cards_screen.dart')
          s = p.read_text()
          s = re.sub(r"\(d\['shots'\]\s+as\s+List\?{2,}\s*\[[^\]]*\]\)", "((d['shots'] as List?) ?? const [])", s)
          s = re.sub(r"d\['shots'\]\s+as\s+List\?{2,}", "d['shots'] as List?", s)
          p.write_text(s)

          # v2590 compile repair: ClipReviewScreen has no jobs parameter.
          p = Path('lib/approved_shots_screen.dart')
          s = p.read_text()
          s = re.sub(r',\s*jobs\s*:\s*shots', '', s)
          p.write_text(s)
          PY

          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart
          flutter pub get
          dart analyze lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart

      - name: Prepare Android
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh 2>/dev/null || true
          if [ -f tools/prepare_android_host_v2590.sh ]; then
            ./tools/prepare_android_host_v2590.sh
          elif [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-REPAIR07
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
