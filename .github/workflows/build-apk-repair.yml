name: Build Mark's AI APK v2590 REPAIR08

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk-repair.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract v2590 project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart compiler errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. video_generation_status_screen.dart: old Number(...) helper was being
          # called with a positional argument although the generated class accepted none.
          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\bNumber\s*\(\s*d\s*\[\s*(['\"])([^'\"]+)\1\s*\]\s*\)", r"_number(d['\2'])", s)
              s = re.sub(r"\bNumber\s*\(\s*d\s*\[\s*(['\"])([^'\"]+)\1\s*\]\s*\)", r"_number(d['\2'])", s)
              if 'num _number(dynamic x)' not in s:
                  s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # 2. shot_cards_screen.dart: v2590 contained malformed List??? / List??
          # syntax in the shots extraction. Replace the whole shots expression with
          # valid Dart instead of trying to repair individual '?' characters.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              shots_expr = "((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e as Map)).toList()"
              s = re.sub(r"shots\s*=\s*\(\s*d\['shots'\].*?\.toList\(\)\s*;", "shots = " + shots_expr + ";", s, flags=re.S)
              s = re.sub(r"d\['shots'\]\s+as\s+List\?+\s*\[[^\]]*\]", "(d['shots'] as List?)", s)
              s = re.sub(r"d\['shots'\]\s+as\s+List\?{2,}", "d['shots'] as List?", s)
              p.write_text(s)

          # 3. approved_shots_screen.dart: ClipReviewScreen does not declare a
          # jobs named parameter. Remove that generated argument wherever present.
          p = Path('lib/approved_shots_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\s*,\s*jobs\s*:\s*shots\s*,?", "", s)
              s = re.sub(r"\s+jobs\s*:\s*shots\s*,?", "", s)
              p.write_text(s)
          PY

          echo '--- Check repaired source snippets ---'
          grep -n -A2 -B2 'shots =' lib/shot_cards_screen.dart || true
          grep -n -A2 -B2 'ClipReviewScreen' lib/approved_shots_screen.dart || true
          grep -n '_number' lib/video_generation_status_screen.dart || true

          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart
          flutter pub get
          dart analyze lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart

      - name: Prepare Android
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh 2>/dev/null || true
          if [ -f tools/prepare_android_host_v2590.sh ]; then
            ./tools/prepare_android_host_v2590.sh
          elif [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-REPAIR08
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
