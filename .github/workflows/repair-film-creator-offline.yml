name: Repair Film Creator Offline Persistence

on:
  push:
    paths:
      - "Mark_s_AI_v2590_BUILD_FIX_2.zip"
      - ".github/workflows/repair-film-creator-offline.yml"
      - "V2591_FILM_CREATOR_REPAIR_TRIGGER.txt"
  workflow_dispatch:

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      - name: Extract and repair Film Creator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work repaired
          mkdir -p work repaired
          unzip -q Mark_s_AI_v2590_BUILD_FIX_2.zip -d work
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("work")
          lib = root / "lib"
          pubspec = root / "pubspec.yaml"

          # Ensure the app has durable Android/iOS application storage.
          text = pubspec.read_text()
          if "path_provider:" not in text:
              if "dependencies:" not in text:
                  raise SystemExit("pubspec.yaml has no dependencies section")
              text = text.replace("dependencies:\n", "dependencies:\n  path_provider: ^2.1.5\n", 1)
          pubspec.write_text(text)

          (lib / "film_creator_project.dart").write_text(r'''import 'dart:convert';
          import 'dart:io';
          import 'package:path_provider/path_provider.dart';

          class FilmCreatorProject {
            final Map<String, dynamic> state;
            FilmCreatorProject(this.state);

            String get id => state['id']?.toString() ?? '';
            String get title => state['title']?.toString() ?? 'Untitled Film';
            String get idea => state['idea']?.toString() ?? '';
            String get genre => state['genre']?.toString() ?? 'Drama';
            int get length => int.tryParse(state['length']?.toString() ?? '5') ?? 5;
            String get style => state['style']?.toString() ?? 'Cinematic';
            String get aspectRatio => state['aspectRatio']?.toString() ?? '16:9';

            static Future<File> _file() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/mark_ai_film_projects.json');
            }

            static Future<List<Map<String, dynamic>>> _readAll() async {
              try {
                final f = await _file();
                if (!await f.exists()) return <Map<String, dynamic>>[];
                final decoded = jsonDecode(await f.readAsString());
                if (decoded is! Map || decoded['projects'] is! List) return <Map<String, dynamic>>[];
                return (decoded['projects'] as List)
                    .whereType<Map>()
                    .map((e) => Map<String, dynamic>.from(e))
                    .toList();
              } catch (_) {
                return <Map<String, dynamic>>[];
              }
            }

            static Future<void> _writeAll(List<Map<String, dynamic>> projects) async {
              final f = await _file();
              await f.writeAsString(jsonEncode({'projects': projects}), flush: true);
            }

            static Future<List<FilmCreatorProject>> all() async {
              final rows = await _readAll();
              return rows.map(FilmCreatorProject.new).toList();
            }

            static Future<FilmCreatorProject?> resume(String id) async {
              for (final p in await _readAll()) {
                if (p['id']?.toString() == id) return FilmCreatorProject(p);
              }
              return null;
            }

            static Future<FilmCreatorProject> create(Map<String, dynamic> values) async {
              final projects = await _readAll();
              final id = 'local-${DateTime.now().microsecondsSinceEpoch}';
              final state = <String, dynamic>{
                'id': id,
                'title': 'Untitled Film',
                'idea': '',
                'genre': 'Drama',
                'length': 5,
                'style': 'Cinematic',
                'aspectRatio': '16:9',
                'status': 'draft',
                ...values,
              };
              projects.insert(0, state);
              await _writeAll(projects);
              return FilmCreatorProject(state);
            }

            Future<FilmCreatorProject> save(Map<String, dynamic> changes) async {
              final projects = await _readAll();
              final index = projects.indexWhere((p) => p['id']?.toString() == id);
              final updated = <String, dynamic>{...state, ...changes, 'id': id, 'updatedAt': DateTime.now().toIso8601String()};
              if (index >= 0) {
                projects[index] = updated;
              } else {
                projects.insert(0, updated);
              }
              await _writeAll(projects);
              return FilmCreatorProject(updated);
            }

            Future<void> delete() async {
              final projects = await _readAll();
              projects.removeWhere((p) => p['id']?.toString() == id);
              await _writeAll(projects);
            }
          }
          '''.replace("          ", "", 1).replace("\n          ", "\n"));

          (lib / "film_creator_screen.dart").write_text(r'''import 'package:flutter/material.dart';
          import 'film_creator_project.dart';
          import 'screenplay_screen.dart';

          class FilmCreatorScreen extends StatefulWidget {
            final String? projectId;
            const FilmCreatorScreen({super.key, this.projectId});
            @override State<FilmCreatorScreen> createState() => _FilmCreatorScreenState();
          }

          class _FilmCreatorScreenState extends State<FilmCreatorScreen> {
            final title = TextEditingController();
            final idea = TextEditingController();
            String genre = 'Drama', style = 'Cinematic', aspect = '16:9';
            int length = 5;
            String? projectId;
            bool loading = true, saving = false;

            final genres = ['Action','Comedy','Drama','Horror','Romance','Sci-Fi','Fantasy','Thriller'];
            final styles = ['Cinematic','Realistic','Animation','Anime','Fantasy','Vintage'];
            final aspects = ['16:9','9:16','1:1'];

            @override void initState() {
              super.initState();
              projectId = widget.projectId;
              _load();
            }

            @override void dispose() {
              title.dispose();
              idea.dispose();
              super.dispose();
            }

            Future<void> _load() async {
              if (projectId != null) {
                final p = await FilmCreatorProject.resume(projectId!);
                if (p != null) {
                  title.text = p.title;
                  idea.text = p.idea;
                  genre = p.genre;
                  length = p.length;
                  style = p.style;
                  aspect = p.aspectRatio;
                }
              }
              if (mounted) setState(() => loading = false);
            }

            Map<String, dynamic> _values() => {
              'title': title.text.trim().isEmpty ? 'Untitled Film' : title.text.trim(),
              'idea': idea.text.trim(),
              'genre': genre,
              'length': length,
              'style': style,
              'aspectRatio': aspect,
              'status': 'draft',
            };

            Future<FilmCreatorProject?> _save() async {
              setState(() => saving = true);
              try {
                final values = _values();
                final FilmCreatorProject p;
                if (projectId == null) {
                  p = await FilmCreatorProject.create(values);
                  projectId = p.id;
                } else {
                  final existing = await FilmCreatorProject.resume(projectId!);
                  if (existing == null) {
                    p = await FilmCreatorProject.create(values);
                    projectId = p.id;
                  } else {
                    p = await existing.save(values);
                  }
                }
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Project saved on this device')),
                  );
                }
                return p;
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Save failed: $e')),
                );
                return null;
              } finally {
                if (mounted) setState(() => saving = false);
              }
            }

            Future<void> _generateScreenplay() async {
              final p = await _save();
              if (p == null || !mounted) return;
              await Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => ScreenplayScreen(projectId: p.id)),
              );
            }

            @override Widget build(BuildContext context) {
              if (loading) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Film Creator'),
                  actions: [
                    IconButton(
                      tooltip: 'Save Project',
                      onPressed: saving ? null : _save,
                      icon: const Icon(Icons.save),
                    ),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Text('Create your film', style: Theme.of(context).textTheme.headlineMedium),
                    const SizedBox(height: 8),
                    const Text('Projects and screenplays are saved locally on this device, so you can continue without an internet connection.'),
                    const SizedBox(height: 20),
                    TextField(controller: title, decoration: const InputDecoration(labelText: 'Film title', border: OutlineInputBorder())),
                    const SizedBox(height: 12),
                    TextField(
                      controller: idea,
                      minLines: 5,
                      maxLines: 9,
                      decoration: const InputDecoration(
                        labelText: 'What is your film about?',
                        hintText: 'Describe the story, characters, setting and what you want to happen…',
                        border: OutlineInputBorder(),
                      ),
                    ),
                    const SizedBox(height: 16),
                    DropdownButtonFormField<String>(
                      value: genre,
                      decoration: const InputDecoration(labelText: 'Genre', border: OutlineInputBorder()),
                      items: genres.map((x) => DropdownMenuItem(value: x, child: Text(x))).toList(),
                      onChanged: (v) { if (v != null) setState(() => genre = v); },
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<String>(
                      value: style,
                      decoration: const InputDecoration(labelText: 'Visual style', border: OutlineInputBorder()),
                      items: styles.map((x) => DropdownMenuItem(value: x, child: Text(x))).toList(),
                      onChanged: (v) { if (v != null) setState(() => style = v); },
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<int>(
                      value: length,
                      decoration: const InputDecoration(labelText: 'Film length (minutes)', border: OutlineInputBorder()),
                      items: [1,5,10,30,60].map((x) => DropdownMenuItem(value: x, child: Text('$x minutes'))).toList(),
                      onChanged: (v) { if (v != null) setState(() => length = v); },
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<String>(
                      value: aspect,
                      decoration: const InputDecoration(labelText: 'Aspect ratio', border: OutlineInputBorder()),
                      items: aspects.map((x) => DropdownMenuItem(value: x, child: Text(x))).toList(),
                      onChanged: (v) { if (v != null) setState(() => aspect = v); },
                    ),
                    const SizedBox(height: 24),
                    FilledButton.icon(
                      onPressed: saving ? null : _save,
                      icon: const Icon(Icons.save),
                      label: Text(saving ? 'SAVING…' : 'SAVE PROJECT'),
                    ),
                    const SizedBox(height: 12),
                    FilledButton.icon(
                      onPressed: saving ? null : _generateScreenplay,
                      icon: const Icon(Icons.auto_awesome),
                      label: const Text('GENERATE SCREENPLAY'),
                    ),
                  ],
                ),
              );
            }
          }
          '''.replace("          ", "", 1).replace("\n          ", "\n"));

          (lib / "film_projects_screen.dart").write_text(r'''import 'package:flutter/material.dart';
          import 'film_creator_project.dart';

          class FilmProjectsScreen extends StatefulWidget {
            final void Function(FilmCreatorProject project)? onResume;
            const FilmProjectsScreen({super.key, this.onResume});
            @override State<FilmProjectsScreen> createState() => _FilmProjectsScreenState();
          }

          class _FilmProjectsScreenState extends State<FilmProjectsScreen> {
            List<FilmCreatorProject> projects = [];
            bool loading = true;

            @override void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              setState(() => loading = true);
              projects = await FilmCreatorProject.all();
              if (mounted) setState(() => loading = false);
            }

            Future<void> createProject() async {
              final c = TextEditingController();
              final name = await showDialog<String>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text('New film project'),
                  content: TextField(controller: c, autofocus: true, decoration: const InputDecoration(hintText: 'Film title')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(context, c.text.trim()), child: const Text('Create')),
                  ],
                ),
              );
              c.dispose();
              if (name == null || name.isEmpty) return;
              await FilmCreatorProject.create({'title': name});
              await load();
            }

            Future<void> remove(FilmCreatorProject p) async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text('Delete project?'),
                  content: Text('Delete "${p.title}" from this device?'),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Delete')),
                  ],
                ),
              );
              if (ok == true) {
                await p.delete();
                await load();
              }
            }

            Future<void> resume(FilmCreatorProject p) async {
              if (widget.onResume != null) {
                widget.onResume!(p);
              } else if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Loaded "${p.title}"')),
                );
              }
            }

            @override Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(
                title: const Text('Film Projects'),
                actions: [IconButton(onPressed: load, icon: const Icon(Icons.refresh))],
              ),
              floatingActionButton: FloatingActionButton.extended(
                onPressed: createProject,
                icon: const Icon(Icons.add),
                label: const Text('New Film'),
              ),
              body: loading
                  ? const Center(child: CircularProgressIndicator())
                  : projects.isEmpty
                      ? const Center(child: Text('No saved projects yet.'))
                      : ListView.separated(
                          padding: const EdgeInsets.all(12),
                          itemCount: projects.length,
                          separatorBuilder: (_, __) => const SizedBox(height: 8),
                          itemBuilder: (context, i) {
                            final p = projects[i];
                            return Card(
                              child: ListTile(
                                onTap: () => resume(p),
                                leading: const CircleAvatar(child: Icon(Icons.movie_outlined)),
                                title: Text(p.title),
                                subtitle: Text('${p.genre} • ${p.style} • saved on device'),
                                trailing: Wrap(
                                  children: [
                                    IconButton(
                                      tooltip: 'Continue',
                                      icon: const Icon(Icons.play_arrow),
                                      onPressed: () => resume(p),
                                    ),
                                    IconButton(
                                      tooltip: 'Delete',
                                      icon: const Icon(Icons.delete_outline),
                                      onPressed: () => remove(p),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
            );
          }
          '''.replace("          ", "", 1).replace("\n          ", "\n"));

          (lib / "screenplay_screen.dart").write_text(r'''import 'package:flutter/material.dart';
          import 'film_creator_project.dart';
          import 'character_bible_screen.dart';
          import 'storyboard_screen.dart';

          class ScreenplayScreen extends StatefulWidget {
            final String projectId;
            const ScreenplayScreen({super.key, required this.projectId});
            @override State<ScreenplayScreen> createState() => _ScreenplayScreenState();
          }

          class _ScreenplayScreenState extends State<ScreenplayScreen> {
            FilmCreatorProject? project;
            bool loading = true, generating = false;

            @override void initState() {
              super.initState();
              load();
            }

            Future<void> load() async {
              project = await FilmCreatorProject.resume(widget.projectId);
              if (mounted) setState(() => loading = false);
            }

            List<Map<String, dynamic>> _makeScenes(FilmCreatorProject p) {
              final count = p.length <= 1 ? 3 : p.length <= 5 ? 5 : p.length <= 10 ? 8 : p.length <= 30 ? 12 : 20;
              final idea = p.idea.trim().isEmpty ? 'the story begins' : p.idea.trim();
              const beats = [
                'Opening image and setup',
                'The main characters are introduced',
                'A problem changes everything',
                'The stakes rise and the plan takes shape',
                'A major discovery forces a difficult choice',
                'The conflict reaches its turning point',
                'The characters face the consequences',
                'The final confrontation begins',
                'The story resolves',
                'Closing image and final emotion',
              ];
              return List.generate(count, (i) => {
                'number': i + 1,
                'title': 'Scene ${i + 1}',
                'action': '${beats[i % beats.length]}. ${idea[0].toUpperCase()}${idea.substring(1)}',
                'duration': (p.length / count).clamp(0.2, 30).toStringAsFixed(1),
              });
            }

            Future<void> generate() async {
              final p = project;
              if (p == null) return;
              setState(() => generating = true);
              try {
                final scenes = _makeScenes(p);
                final screenplay = {
                  'generatedOffline': true,
                  'prompt': 'Create a ${p.length}-minute ${p.genre} film titled "${p.title}" in ${p.style} style. Story idea: ${p.idea}',
                  'generatedAt': DateTime.now().toIso8601String(),
                };
                project = await p.save({
                  'screenplay': screenplay,
                  'scenes': scenes,
                  'status': 'screenplay-ready',
                });
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Screenplay generated and saved on this device')),
                );
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Generation failed: $e')),
                );
              } finally {
                if (mounted) setState(() => generating = false);
              }
            }

            @override Widget build(BuildContext context) {
              if (loading) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              final p = project;
              if (p == null) return const Scaffold(body: Center(child: Text('Project not found')));
              final state = p.state;
              final scenes = (state['scenes'] as List? ?? []).whereType<Map>().toList();
              final screenplay = state['screenplay'];
              return Scaffold(
                appBar: AppBar(title: Text(p.title)),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Text('Screenplay', style: Theme.of(context).textTheme.headlineMedium),
                    const SizedBox(height: 8),
                    Text('${p.genre} • ${p.length} minutes • ${p.style}'),
                    const SizedBox(height: 20),
                    FilledButton.icon(
                      onPressed: generating ? null : generate,
                      icon: generating
                          ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2))
                          : const Icon(Icons.auto_awesome),
                      label: Text(generating ? 'GENERATING…' : 'GENERATE SCREENPLAY'),
                    ),
                    if (screenplay != null) ...[
                      const SizedBox(height: 20),
                      const Text('Screenplay structure', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 8),
                      ...scenes.map((s) => Card(
                        child: ListTile(
                          leading: CircleAvatar(child: Text('${s['number'] ?? ''}')),
                          title: Text(s['title']?.toString() ?? 'Scene'),
                          subtitle: Text(s['action']?.toString() ?? ''),
                        ),
                      )),
                      const SizedBox(height: 12),
                      OutlinedButton.icon(
                        onPressed: () => showDialog(
                          context: context,
                          builder: (_) => AlertDialog(
                            title: const Text('Generation prompt'),
                            content: SingleChildScrollView(child: Text((screenplay is Map ? screenplay['prompt'] : '')?.toString() ?? '')),
                            actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('Close'))],
                          ),
                        ),
                        icon: const Icon(Icons.description),
                        label: const Text('VIEW GENERATION PROMPT'),
                      ),
                      const SizedBox(height: 10),
                      OutlinedButton.icon(
                        onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => CharacterBibleScreen(projectId: widget.projectId))),
                        icon: const Icon(Icons.people),
                        label: const Text('CHARACTER BIBLE'),
                      ),
                      const SizedBox(height: 10),
                      OutlinedButton.icon(
                        onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => StoryboardScreen(projectId: widget.projectId))),
                        icon: const Icon(Icons.view_carousel),
                        label: const Text('BUILD STORYBOARD'),
                      ),
                    ],
                  ],
                ),
              );
            }
          }
          '''.replace("          ", "", 1).replace("\n          ", "\n"));

          print("Film Creator offline repair applied");
          PY

          # Rebuild the repaired source archive.
          cd work
          zip -qr ../repaired/Mark_s_AI_v2591_FILM_CREATOR_OFFLINE_REPAIRED.zip .
          cd ..
          cp repaired/Mark_s_AI_v2591_FILM_CREATOR_OFFLINE_REPAIRED.zip ./Mark_s_AI_v2591_FILM_CREATOR_OFFLINE_REPAIRED.zip

      - name: Prepare modern Android host
        shell: bash
        run: |
          set -euo pipefail
          cd work
          # The source archive carries an obsolete Android v1 embedding. Generate
          # a clean modern Flutter Android host before building the repaired app.
          rm -rf android
          flutter create --platforms=android --org com.marksai .

      - name: Prepare Android host
        shell: bash
        run: |
          set -euo pipefail
          cd work
          mkdir -p android/app/src/main/java/com/example/marksai
          test -f android/app/src/main/AndroidManifest.xml || {
            mkdir -p android/app/src/main
            cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Marks AI" android:icon="@mipmap/ic_launcher">
              <activity android:name="android.app.Activity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          }

      - name: Get packages and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd work
          flutter pub get
          dart format lib/film_creator_project.dart lib/film_creator_screen.dart lib/film_projects_screen.dart lib/screenplay_screen.dart
          flutter analyze lib/film_creator_project.dart lib/film_creator_screen.dart lib/film_projects_screen.dart lib/screenplay_screen.dart || true
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Mark_s_AI_v2591_FILM_CREATOR_OFFLINE.apk
          sha256sum ../Mark_s_AI_v2591_FILM_CREATOR_OFFLINE.apk | tee ../Mark_s_AI_v2591_FILM_CREATOR_OFFLINE.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2591-Film-Creator-Offline-APK
          path: |
            Mark_s_AI_v2591_FILM_CREATOR_OFFLINE.apk
            Mark_s_AI_v2591_FILM_CREATOR_OFFLINE.apk.sha256
            Mark_s_AI_v2591_FILM_CREATOR_OFFLINE_REPAIRED.zip
          if-no-files-found: error
