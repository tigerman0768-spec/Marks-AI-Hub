name: Marks AI renderer install-test
on:
  workflow_dispatch:
  push:
    paths:
      - 'Mark_s_AI_v2590_BUILD_FIX_2.zip'
      - 'tools/v2624_raw_frame_video_renderer.py'
      - '.github/workflows/marks-ai-renderer-check.yml'
permissions:
  contents: read
jobs:
  renderer-apk:
    name: Patch renderer and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir -p app
          unzip -q Mark_s_AI_v2590_BUILD_FIX_2.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Apply offline Film Creator patch
        working-directory: app
        run: python3 ../tools/apply_offline_patch_v2590.py
      - name: Locate video renderer source
        working-directory: app
        run: |
          echo '--- video-related Dart files ---'
          find lib -type f -iname '*video*' -o -iname '*studio*' | sort | head -100
          echo '--- main imports ---'
          grep -nE 'video|studio|film' lib/main.dart | head -100
      - name: Apply renderer patch when the matching source exists
        working-directory: app
        run: |
          if [ -f lib/local_video_studio_screen.dart ]; then
            python3 ../tools/v2624_raw_frame_video_renderer.py
            grep -Fq 'frames.rgba' lib/local_video_studio_screen.dart
            grep -Fq -- '-f rawvideo -pixel_format rgba -video_size 640x360' lib/local_video_studio_screen.dart
          else
            echo 'Renderer patch does not match this archive: Local Video Studio source is absent.'
            echo 'Continuing with APK compile diagnostics; renderer repair remains unverified.'
          fi
      - name: Apply targeted Dart compile fixes
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/film_library_screen.dart')
          s=p.read_text()
          old='     ])));\n    }));'
          new='     ])));\n    }));'
          if old not in s: raise SystemExit('Film Library return closure target not found; refusing unsafe edit')
          p.write_text(s.replace(old,new,1))
          p=Path('lib/film_projects_screen.dart')
          s=p.read_text()
          old='trailing:Wrap(mainAxisSize:MainAxisSize.min,children:['
          if old not in s: raise SystemExit('Film Projects Wrap target not found; refusing unsafe edit')
          p.write_text(s.replace(old,'trailing:Wrap(children:[',1))
          p=Path('lib/release_build_center_screen.dart')
          s=p.read_text()
          old="subtitle:Text(d?['message']??'':'—')"
          if old not in s: raise SystemExit('Release Build Centre subtitle target not found; refusing unsafe edit')
          s=s.replace(old,"subtitle:Text(d?['message']?.toString() ?? '—')",1)
          old='      ]);\n  }\n}'
          if old not in s: raise SystemExit('Release Build Centre Scaffold closure target not found; refusing unsafe edit')
          p.write_text(s.replace(old,'      ]));\n  }\n}',1))
          PY
          dart format lib/film_library_screen.dart lib/film_projects_screen.dart lib/release_build_center_screen.dart
      - name: Capture failing Dart source context
        if: always()
        working-directory: app
        run: |
          for spec in 'lib/film_library_screen.dart:1:100' 'lib/release_build_center_screen.dart:82:160' 'lib/film_projects_screen.dart:1:100'; do
            file=${spec%%:*}; rest=${spec#*:}; start=${rest%%:*}; end=${rest##*:}
            if [ -f "$file" ]; then
              echo "--- $file lines $start-$end ---"
              nl -ba "$file" | sed -n "${start},${end}p"
            else
              echo "--- missing $file ---"
            fi
          done
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-renderer-debug-test
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
