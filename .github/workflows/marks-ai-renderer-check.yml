name: Marks AI renderer install-test (MP4 fix)
on:
  workflow_dispatch:
  push:
    paths:
      - 'Mark_s_AI_v2590_BUILD_FIX_2.zip'
      - 'tools/v2624_raw_frame_video_renderer.py'
      - 'tools/apply_local_animatic_renderer.py'
      - 'tools/v2625_local_mp4_renderer.py'
      - 'tools/test_local_mp4_emulator.py'
      - '.github/workflows/marks-ai-renderer-check.yml'
permissions:
  contents: read
jobs:
  renderer-apk:
    name: Patch renderer and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir -p app
          unzip -q Mark_s_AI_v2590_BUILD_FIX_2.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Apply offline Film Creator patch
        working-directory: app
        run: python3 ../tools/apply_offline_patch_v2590.py
      - name: Install local MP4 storyboard renderer
        working-directory: app
        run: |
          python3 ../tools/apply_local_animatic_renderer.py
          grep -Fq "marksai/local_video_renderer" lib/film_creator_screen.dart
          grep -Fq "renderPreview" android/app/src/main/kotlin/com/marksai/app/MainActivity.kt
          grep -Fq "MediaMuxer" android/app/src/main/kotlin/com/marksai/app/MainActivity.kt
      - name: Add local MP4 renderer result mapping verification
        working-directory: app
        run: |
          grep -Fq 'savedUri = renderPreview' ../tools/apply_local_animatic_renderer.py
          grep -Fq 'result.success(mapOf("path" to savedUri' ../tools/apply_local_animatic_renderer.py
      - name: Locate video renderer source
        working-directory: app
        run: |
          echo '--- video-related Dart files ---'
          find lib -type f -iname '*video*' -o -iname '*studio*' | sort | head -100
          echo '--- main imports ---'
          grep -nE 'video|studio|film' lib/main.dart | head -100
      - name: Diagnose actual app entry point and video pipeline
        working-directory: app
        run: |
          echo '--- pubspec dependencies ---'
          sed -n '/^dependencies:/,/^[^ ]/p' pubspec.yaml
          echo '--- lib/main.dart ---'
          sed -n '1,260p' lib/main.dart
          for file in lib/film_creator_screen.dart lib/film_projects_screen.dart lib/final_render_worker_queue_screen.dart lib/film_library_screen.dart lib/mark_ai_dashboard_screen.dart lib/final_film_player_screen.dart lib/film_library_player_screen.dart lib/film_details_screen.dart lib/ai_timeline_trim_renderer_screen.dart lib/ai_transition_renderer_screen.dart lib/video_generation_screen.dart lib/video_generation_orchestrator_screen.dart lib/video_generation_submit_screen.dart lib/video_generation_manifest_screen.dart lib/video_generation_clip_inventory_screen.dart; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              sed -n '1,240p' "$file"
            fi
          done
          echo '--- dashboard routes and buttons ---'
          grep -RniE 'VideoGenerationScreen|FilmLibraryScreen|FinalFilmPlayerScreen|LocalVideoStudio|Navigator.push|onPressed' lib/mark_ai_dashboard_screen.dart lib/*film*screen.dart 2>/dev/null | head -240 || true
          echo '--- all backend/API routes and local storage ---'
          grep -RniE 'offline://backend|http://|https://|SharedPreferences|path_provider|File\(|Directory\(|writeAsBytes|writeAsString|api/' lib android pubspec.yaml | head -360 || true
          echo '--- Film Creator generation flow and local project model ---'
          grep -nE 'Future<void>|Future<|create|generate|render|backend|filmUrl|productionId|renderId|save|export|Navigator|FilledButton|onPressed' lib/film_creator_screen.dart | head -260
          sed -n '240,560p' lib/film_creator_screen.dart
          echo '--- film_creator_project.dart ---'
          sed -n '1,300p' lib/film_creator_project.dart
          echo '--- Android host files / package and channels ---'
          find android -maxdepth 5 -type f | sort | head -100
          grep -RniE 'package |MainActivity|MethodChannel|applicationId|namespace|MediaCodec|MediaMuxer|MediaStore' android | head -200 || true
          echo '--- media / ffmpeg / gallery APIs ---'
          grep -RniE 'ffmpeg|video_player|gallery_saver|media_store|saveToGallery|export.*mp4|render.*video|Process.run|MethodChannel' lib android pubspec.yaml | head -280 || true
      - name: Apply renderer patch when the matching source exists
        working-directory: app
        run: |
          if [ -f lib/local_video_studio_screen.dart ]; then
            python3 ../tools/v2624_raw_frame_video_renderer.py
            grep -Fq 'frames.rgba' lib/local_video_studio_screen.dart
            grep -Fq -- '-f rawvideo -pixel_format rgba -video_size 640x360' lib/local_video_studio_screen.dart
          else
            echo 'Renderer patch does not match this archive: Local Video Studio source is absent.'
            echo 'Continuing with APK compile diagnostics; renderer repair remains unverified.'
          fi
      - name: Apply targeted Dart compile fixes
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Keep Film Library source intact until a structural fix is proven by formatter.
          p=Path('lib/film_projects_screen.dart')
          s=p.read_text()
          old='trailing:Wrap(mainAxisSize:MainAxisSize.min,children:['
          if old not in s: raise SystemExit('Film Projects Wrap target not found; refusing unsafe edit')
          p.write_text(s.replace(old,'trailing:Wrap(children:[',1))
          p=Path('lib/film_library_screen.dart')
          s=p.read_text()
          old='     ]));\n    }));'
          if old not in s: raise SystemExit('Film Library closure target not found; refusing unsafe edit')
          p.write_text(s.replace(old,'     ])));\n    })),',1))
          p=Path('lib/release_build_center_screen.dart')
          s=p.read_text()
          old="subtitle:Text(d?['message']??'':'—')"
          if old not in s: raise SystemExit('Release Build Centre subtitle target not found; refusing unsafe edit')
          s=s.replace(old,"subtitle:Text(d?['message']?.toString() ?? '—')",1)
          old='      ]);\n  }\n}'
          if old not in s: raise SystemExit('Release Build Centre Scaffold closure target not found; refusing unsafe edit')
          p.write_text(s.replace(old,'      ]));\n  }\n}',1))
          PY
          dart format lib/film_library_screen.dart lib/film_projects_screen.dart lib/release_build_center_screen.dart
      - name: Capture failing Dart source context
        if: always()
        working-directory: app
        run: |
          for spec in 'lib/film_library_screen.dart:1:100' 'lib/release_build_center_screen.dart:82:160' 'lib/film_projects_screen.dart:1:100'; do
            file=${spec%%:*}; rest=${spec#*:}; start=${rest%%:*}; end=${rest##*:}
            if [ -f "$file" ]; then
              echo "--- $file lines $start-$end ---"
              nl -ba "$file" | sed -n "${start},${end}p"
            else
              echo "--- missing $file ---"
            fi
          done
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Runtime-test local MP4 generation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: |
            sudo apt-get install -y ffmpeg python3
            python3 tools/test_local_mp4_emulator.py
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-renderer-debug-test
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
