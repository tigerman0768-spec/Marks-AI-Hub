name: Build Mark's AI APK v2590 FIXED

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract v2590 project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair known v2590 Dart errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('lib').rglob('*.dart'):
              s = p.read_text()
              s = re.sub(r'\n(?:num|double|int)\s+_number\(dynamic\s+x\)\s*=>[^;]*;\s*', '\n', s)
              s = re.sub(r'\nclass\s+Number\s*\{.*?\}\s*', '\n', s, flags=re.S)
              s = re.sub(r'\bNumber\s*\(', '_number(', s)
              s = re.sub(r'as\s+List\?+(?:\s*\[\s*\])?', 'as List?', s)
              s = re.sub(r'as\s+Map\?+(?:\s*\{\s*\})?', 'as Map?', s)
              s = s.replace('as List???[]', 'as List?').replace('as Map???{}', 'as Map?')
              s = re.sub(r'ClipReviewScreen\(\s*projectId\s*:\s*widget\.projectId\s*,\s*jobs\s*:\s*shots\s*\)', 'ClipReviewScreen(projectId: widget.projectId)', s, flags=re.S)
              p.write_text(s)

          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"shots\s*=\s*\(d\['shots'\]\s+as\s+List[^\n]*?\.map\(\(e\)\s*=>\s*Map<String,\s*dynamic>\.from\(e\)\)\.toList\(\);", "shots = ((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e)).toList();", s, flags=re.S)
              p.write_text(s)

          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text().rstrip()
              s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)
          PY
          dart format lib
          flutter pub get
          dart analyze

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Migrate Android embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              s = s[:end+1] + '\n        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end+1:]
          manifest.write_text(s)
          PY

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FIXED
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
