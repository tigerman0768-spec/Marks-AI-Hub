name: Build Mark's AI APK v2590 FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mark's AI v2590
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Repair v2590 generated Dart blockers
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('lib')

          def edit(name, fn):
              p = root / name
              if not p.exists(): return
              s = p.read_text()
              s2 = fn(s)
              if s2 != s:
                  p.write_text(s2)
                  print('repaired', name)

          # Numeric parsing and malformed nullable collection syntax.
          p = root / 'video_generation_status_screen.dart'
          if p.exists():
              s = p.read_text()
              s = re.sub(r'\bNumber\s*\(', '_number(', s)
              if 'num _number(dynamic x)' not in s:
                  s += "\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)
          for p in root.glob('*.dart'):
              s = p.read_text()
              s = s.replace('List???[1]', 'List?').replace('List???[]', 'List?').replace('List???', 'List?')
              s = s.replace('Map???[1]', 'Map?').replace('Map???{}', 'Map?').replace('Map???', 'Map?')
              p.write_text(s)

          # Keep the known valid assembler source; undo the earlier over-close repair if present.
          edit('ai_film_assembler_screen.dart', lambda s: s.replace('                    ])));', '                    ]))));'))

          # Existing targeted fixes.
          edit('approved_shots_screen.dart', lambda s: re.sub(r',\s*jobs\s*:\s*shots', '', s))
          edit('real_clip_generation_screen.dart', lambda s: s.replace('double.tryParse(duration.text)||5', 'double.tryParse(duration.text) ?? 5'))
          edit('film_library_screen.dart', lambda s: s.replace("onPressed:()=>{search.clear(),load()}", "onPressed:(){search.clear();load();}"))
          edit('film_projects_screen.dart', lambda s: s.replace('Wrap(mainAxisSize:MainAxisSize.min,children:[', 'Wrap(children:['))
          edit('smart_one_click_final_render_screen.dart', lambda s: s.replace("(progress!['progress'] as num?)?.toDouble().clamp(0,100)/100", "(((progress!['progress'] as num?)?.toDouble() ?? 0).clamp(0,100))/100"))
          edit('timeline_audio_panel.dart', lambda s: s.replace('      ]));\n}', '      ])));\n}'))

          def review_fix(s, list_key, review_key, decision_key):
              s = s.replace(f"(data['{list_key}'] as List?).map((x) => Map<String, dynamic>.from(x))", f"((data['{list_key}'] as List?) ?? const []).map((x) => Map<String, dynamic>.from(x))")
              s = s.replace(f"(data['{review_key}'] as Map?)", f"((data['{review_key}'] as Map?) ?? const {{}})")
              s = s.replace(f"(rev['{decision_key}'] as List?).map((x) => Map<String, dynamic>.from(x))", f"((rev['{decision_key}'] as List?) ?? const []).map((x) => Map<String, dynamic>.from(x))")
              return s
          edit('canonical_timeline_review_screen.dart', lambda s: review_fix(s, 'timeline', 'review', 'itemDecisions'))
          edit('final_cut_review_screen.dart', lambda s: review_fix(s, 'clips', 'review', 'decisions'))

          p = root / 'video_generation_launch_screen.dart'
          if p.exists():
              s = p.read_text().replace('Map<String, dynamic>? launch;', 'Map<String, dynamic>? launchResult;')
              s = s.replace('launch = jsonDecode(r.body)', 'launchResult = jsonDecode(r.body)')
              s = s.replace('if (launch != null)', 'if (launchResult != null)')
              for key in ['status','shotCount','dryRun','message']:
                  s = s.replace(f"launch!['{key}']", f"launchResult!['{key}']")
              p.write_text(s)

          # Exact remaining compile/syntax repairs.
          def fix_film_library(s):
              s = s.replace('     ]));\n    }));', '     ])));\n    });')
              return s
          edit('film_library_screen.dart', fix_film_library)

          def fix_shot_cards(s):
              s = s.replace("shots=(d['shots'] as List?).map((e)=>Map<String,dynamic>.from(e)).toList();", "shots=((d['shots'] as List?) ?? const []).map((e)=>Map<String,dynamic>.from(e)).toList();")
              s = s.replace('      })),]) ;', '      })),]));')
              return s
          edit('shot_cards_screen.dart', fix_shot_cards)

          def fix_dialogue(s):
              s = s.replace('$projectId/screenplay/extract-dialogue', '${widget.projectId}/screenplay/extract-dialogue')
              s = s.replace('$projectId/dialogue/acting-direction', '${widget.projectId}/dialogue/acting-direction')
              s = s.replace('        });\n}', '        }));\n}')
              return s
          edit('dialogue_timeline_screen.dart', fix_dialogue)

          edit('smart_clip_review_screen.dart', lambda s: s.replace('        }))\n  );', '        })))\n  ]));'))

          def fix_release_build(s):
              s = s.replace("d?['configured']==true", "(d?['configured'] == true)")
              s = s.replace("Text(d?['message']??'':'—')", "Text((d?['message'] ?? '—').toString())")
              s = s.replace("Text(d?['version']??'v2570')", "Text((d?['version'] ?? 'v2570').toString())")
              s = s.replace('      ]);\n  }\n}', '      ]));\n  }\n}')
              return s
          edit('release_build_center_screen.dart', fix_release_build)

          p = root / 'production_plan_review_screen.dart'
          if p.exists():
              s = p.read_text()
              s = s.replace("      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n", "")
              marker = "      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n            content: Text(r.statusCode < 300\n                ? (configured\n                    ? 'Video generation started'\n                    : 'Video generation plan created (dry run)')\n                : 'Video generation failed (${r.statusCode})')),\n      );"
              if marker in s:
                  s = s.replace(marker, "      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text(configured ? 'Video generation started' : 'Video generation plan created (dry run)')),\n      );\n      if (r.statusCode < 300 && mounted) {\n        Navigator.push(context, MaterialPageRoute(builder: (_) => VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }")
              s = re.sub(r"\n      if \(r\.statusCode < 300 && mounted\) \{\n        Navigator\.push\(.*?VideoGenerationStatusScreen\(projectId: widget\.projectId\)\)\);\n      \}\n    \} catch", "\n    } catch", s, flags=re.S)
              p.write_text(s)

          # Replace the malformed generated AI shot analysis screen with valid Dart.
          (root / 'ai_shot_content_analysis_screen.dart').write_text('''import 'dart:convert';
import 'package:flutter/material.dart';
import 'package:http/http.dart' as http;

class AiShotContentAnalysisScreen extends StatefulWidget {
  final String projectId;
  const AiShotContentAnalysisScreen({super.key, required this.projectId});
  @override State<AiShotContentAnalysisScreen> createState() => _AiShotContentAnalysisScreenState();
}

class _AiShotContentAnalysisScreenState extends State<AiShotContentAnalysisScreen> {
  static const base = 'http://10.0.2.2:3000';
  bool loading = true;
  Map<String, dynamic>? data;
  @override void initState() { super.initState(); load(); }
  Future<void> load() async {
    if (mounted) setState(() => loading = true);
    try {
      final r = await http.get(Uri.parse('$base/api/projects/${widget.projectId}/shot-content-analysis'));
      if (r.statusCode < 300) data = Map<String, dynamic>.from(jsonDecode(r.body));
    } catch (_) {}
    if (mounted) setState(() => loading = false);
  }
  Future<void> apply() async {
    final r = await http.post(Uri.parse('$base/api/projects/${widget.projectId}/shot-content-analysis/apply'));
    if (mounted && r.statusCode < 300) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Shot analysis saved to project')));
      await load();
    }
  }
  @override Widget build(BuildContext context) {
    final items = (data?['items'] as List?) ?? const [];
    return Scaffold(
      appBar: AppBar(title: const Text('AI Shot Content Analysis')),
      body: loading ? const Center(child: CircularProgressIndicator()) : Column(
        children: [
          Padding(padding: const EdgeInsets.all(12), child: SizedBox(width: double.infinity, child: FilledButton.icon(onPressed: apply, icon: const Icon(Icons.visibility), label: const Text('ANALYSE & SAVE')))),
          Padding(padding: const EdgeInsets.symmetric(horizontal: 12), child: Align(alignment: Alignment.centerLeft, child: Text('${data?['analysedCount'] ?? items.length} shots analysed'))),
          Expanded(child: ListView.builder(
            itemCount: items.length,
            itemBuilder: (context, i) {
              final x = Map<String, dynamic>.from(items[i] as Map);
              final a = Map<String, dynamic>.from((x['analysis'] as Map?) ?? const {});
              return Card(child: ListTile(
                leading: CircleAvatar(child: Text('${x['shotNumber'] ?? i + 1}')),
                title: Text('${a['contentType'] ?? 'Shot'} • complexity ${a['visualComplexity'] ?? '—'}'),
                subtitle: Text('Recommended hold ${a['recommendedHold'] ?? '—'}s • confidence ${a['confidence'] ?? '—'}'),
              ));
            },
          )),
        ],
      ),
    );
  }
}
''')

          # Remove generated tests.
          test = Path('test')
          if test.exists():
              import shutil
              shutil.rmtree(test)

          import subprocess
          subprocess.run(['dart', 'format', 'lib'], check=False)
          PY

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload source for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-source-fixed
          path: app/lib
          if-no-files-found: error

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FIXED
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
