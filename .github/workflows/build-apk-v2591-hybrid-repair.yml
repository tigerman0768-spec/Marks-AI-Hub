  push:
    paths:
      - 'Mark_s_AI_v2590_BUILD_FIX_2.zip'
      - '.github/workflows/build-apk-v2591-hybrid-repair.yml'
      - 'V2591_BUILD_TRIGGER.txt'
      - 'tools/v2594_add_video_status.py'
      - 'tools/v2595_add_clip_library.py'
      - 'tools/v2592_patch_film_creator.py'
      - 'tools/v2596_add_film_assembly.py'
      - 'tools/v2597_add_mp4_renderer.py'
      - 'tools/v2600_add_local_video_studio.py'
      - 'tools/test_v2600_local_video_prompt.py'
      - 'tools/v2601_fix_film_creator_feedback.py'
      - 'tools/v2602_fix_screenplay_dart.py'
      - 'tools/v2603_construction_timelapse.py'
      - 'tools/v2604_scene_planner_local_video.py'
      - 'tools/v2605_download_generated_clips.py'
      - 'tools/v2606_resume_safe_video_generation.py'
      - 'tools/v2607_save_finished_film_to_gallery.py'
      - 'tools/v2608_recover_scene_submission_errors.py'
      - 'tools/v2609_recover_malformed_status_json.py'
      - 'tools/v2610_validate_scene_and_final_mp4.py'
      - 'tools/v2611_validate_video_playability.py'
