          dart format lib
          if grep -RIl --exclude-dir=.git '10.0.2.2:3000/api/projects' lib; then
            echo "Old online-only project endpoint still present"
            exit 1
          fi

      - name: Prepare Android host for Flutter 3.47
        working-directory: app
        run: |
          if [ -f tools/prepare_android_host_v2590.sh ]; then
            chmod +x tools/prepare_android_host_v2590.sh
            ./tools/prepare_android_host_v2590.sh
          elif [ -f tools/prepare_android_host_v2591.sh ]; then
            chmod +x tools/prepare_android_host_v2591.sh
            ./tools/prepare_android_host_v2591.sh
          else
            echo "No Android host preparation script found"
            exit 1
          fi

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify and stage APK
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/install
          cp build/app/outputs/flutter-apk/app-release.apk build/install/Mark_s_AI_v2591.apk
          sha256sum build/install/Mark_s_AI_v2591.apk | tee build/install/Mark_s_AI_v2591.apk.sha256
          echo 'APK built successfully; source-level offline endpoint check already passed before compilation.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2591-HYBRID-REPAIR-APK
          path: |
            app/build/install/Mark_s_AI_v2591.apk
            app/build/install/Mark_s_AI_v2591.apk.sha256
          if-no-files-found: error
