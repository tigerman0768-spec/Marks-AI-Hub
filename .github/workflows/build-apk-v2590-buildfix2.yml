name: Mark's AI v2590 BUILD FIX 2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mark_s_AI_v2590_BUILD_FIX_2.zip'
      - '.github/workflows/build-apk-v2590-buildfix2.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract BUILD FIX 2 project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_BUILD_FIX_2.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Verify v2590 project
        working-directory: app
        run: node tools/check_flutter_project_v2590.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android host
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Repair v2590 BUILD FIX 2 Dart syntax
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib")
          def rep(name,a,b):
              f=p/name; s=f.read_text(); f.write_text(s.replace(a,b))
          rep("film_library_screen.dart","     ]));\n    }));","     ])));\n    }));")
          rep("shot_cards_screen.dart","      })),]) ;","      }))]);")
          rep("dialogue_timeline_screen.dart","        });\n}","        });\n  );\n}")
          rep("smart_clip_review_screen.dart","        }))\n  );","        }))]);\n  );")
          rep("release_build_center_screen.dart","Icon(d?['configured']==true?Icons.cloud_done:Icons.cloud_off)","Icon((d?['configured']==true)?Icons.cloud_done:Icons.cloud_off)")
          rep("release_build_center_screen.dart","Text(d?['configured']==true?'GitHub Actions configured':'GitHub Actions not configured')","Text((d?['configured']==true)?'GitHub Actions configured':'GitHub Actions not configured')")
          rep("release_build_center_screen.dart","Text(d?['message']??'':'—')","Text(d?['message']?.toString() ?? '—')")
          rep("film_projects_screen.dart","Wrap(mainAxisSize:MainAxisSize.min,children:[","Wrap(children:[")
          rep("production_plan_review_screen.dart","      if (r.statusCode < 300 && mounted) {\n        Navigator.push(context, MaterialPageRoute(builder: (_) => VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n","")
          rep("dialogue_timeline_screen.dart","\$projectId","\${widget.projectId}")
          rep("smart_one_click_final_render_screen.dart","(progress!['progress'] as num?)?.toDouble().clamp(0,100)/100","(((progress!['progress'] as num?)?.toDouble() ?? 0).clamp(0,100))/100")
          rep("ai_shot_content_analysis_screen.dart","Map<String,dynamic>.from(x['analysis'])","Map<String,dynamic>.from(x['analysis'] ?? {})")
          PY
          dart format lib || true
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify and stage APK
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/install
          cp build/app/outputs/flutter-apk/app-release.apk build/install/Mark_s_AI_v2590.apk
          sha256sum build/install/Mark_s_AI_v2590.apk | tee build/install/Mark_s_AI_v2590.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-BUILD-FIX-2-APK
          path: |
            app/build/install/Mark_s_AI_v2590.apk
            app/build/install/Mark_s_AI_v2590.apk.sha256
          if-no-files-found: error

      - name: Build release AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-BUILD-FIX-2-AAB
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
