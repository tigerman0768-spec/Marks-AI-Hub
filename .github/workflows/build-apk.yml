name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('lib')

          # Repair the JS-style Number(...) calls from the v2590 source.
          p = lib / 'video_generation_status_screen.dart'
          if p.exists():
              s = p.read_text()
              s = s.replace('Number(', '_number(')
              if 'num _number(dynamic x)' not in s:
                  s += chr(10) + chr(10) + "num _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;" + chr(10)
              p.write_text(s)

          # Repair every known v2590 List??? / Map??? corruption exactly.
          fixes = {
              "(data['clips'] as List???[])": "((data['clips'] as List?) ?? [])",
              "(data['review'] as Map???{})": "((data['review'] as Map?) ?? {})",
              "(rev['decisions'] as List???[])": "((rev['decisions'] as List?) ?? [])",
              "(data['timeline'] as List???[])": "((data['timeline'] as List?) ?? [])",
              "(rev['itemDecisions'] as List???[])": "((rev['itemDecisions'] as List?) ?? [])",
              "(d['shots'] as List???[])": "((d['shots'] as List?) ?? [])",
          }
          for p in lib.glob('*.dart'):
              s = p.read_text()
              for old, new in fixes.items():
                  s = s.replace(old, new)
              s = s.replace('List???', 'List?')
              s = s.replace('Map???', 'Map?')
              s = s.replace('List??', 'List?')
              s = s.replace('Map??', 'Map?')
              p.write_text(s)

          # Make shot-card loading update the State field, not a shadowing local.
          p = lib / 'shot_cards_screen.dart'
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "final shots = ((d['shots'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();",
                  "shots = ((d['shots'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();",
              )
              p.write_text(s)

          # Remove the obsolete jobs argument from approved-shots -> clip-review navigation.
          p = lib / 'approved_shots_screen.dart'
          if p.exists():
              s = p.read_text().replace(',jobs:shots', '').replace(', jobs: shots', '')
              p.write_text(s)

          # Repair the two known v2590 bracket corruptions.
          p = lib / 'ai_film_assembler_screen.dart'
          if p.exists():
              p.write_text(p.read_text().replace('        ])));', '        ]))));'))

          p = lib / 'film_library_screen.dart'
          if p.exists():
              lines = p.read_text().splitlines()
              for i in range(len(lines) - 1):
                  if lines[i].strip() == ']));' and lines[i + 1].strip() == '}));':
                      lines[i] = lines[i].replace(']));', '])));')
                      break
              p.write_text(chr(10).join(lines) + chr(10))

          # Never allow the known corruption markers to reach Dart formatting/build.
          bad = []
          for p in lib.glob('*.dart'):
              text = p.read_text()
              for marker in ('???', 'List??', 'Map??'):
                  if marker in text:
                      bad.append(f'{p}:{marker}')
          if bad:
              raise SystemExit('Unrepaired Dart corruption remains: ' + ', '.join(bad))
          PY

          dart format lib
          flutter pub get

      - name: Verify Dart source before Android build
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          dart analyze lib

      - name: Package repaired source for diagnostics
        if: always()
        working-directory: app
        run: |
          zip -qr ../Marks-AI-v2590-repaired-source.zip lib pubspec.yaml

      - name: Upload repaired source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-repaired-source
          path: Marks-AI-v2590-repaired-source.zip
          if-no-files-found: error

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              s = s[:end + 1] + chr(10) + '        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end + 1:]
          manifest.write_text(s)
          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if root.exists():
                  for p in root.rglob('*'):
                      if p.suffix in ('.java', '.kt'):
                          text = p.read_text()
                          text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                          text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                          text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                          text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                          p.write_text(text)
          PY
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then exit 1; fi

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
