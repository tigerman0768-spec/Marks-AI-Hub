name: Build Mark's AI APK v2590 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Enforce v2590 Dart repairs
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Repair the known generated-source corruptions across the whole Dart tree.
          for p in Path('lib').rglob('*.dart'):
              s = p.read_text()

              # Invalid Number(...) calls in v2590 status screen.
              if p.name == 'video_generation_status_screen.dart':
                  s = re.sub(
                      r"\bNumber\s*\(\s*d\s*\[\s*(['\"])(total|completed)\1\s*\]\s*\)",
                      lambda m: "_number(d['%s'])" % m.group(2),
                      s,
                  )
                  if '_number(dynamic x)' not in s:
                      s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"

              # Corrupted null-aware list/map expressions.
              s = s.replace('as List???[]', 'as List? ?? []')
              s = s.replace('as Map???{}', 'as Map? ?? {}')
              s = s.replace('List???[1]', 'List?')
              s = s.replace('Map???[1]', 'Map?')

              # Remove the known obsolete jobs argument passed to ClipReviewScreen.
              if p.name == 'approved_shots_screen.dart':
                  s = re.sub(r',\s*jobs\s*:\s*shots', '', s)

              p.write_text(s)
          PY

          dart format lib
          echo '--- repaired-source verification ---'
          if grep -RInE "Number\s*\(|List\?\?\?\[|Map\?\?\?\[|as List\?\?\?\[|as Map\?\?\?\{|jobs\s*:\s*shots" lib --include='*.dart'; then
            echo 'ERROR: known corrupted Dart remains'
            exit 1
          fi
          echo 'Dart repair verification passed.'
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload repaired source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-repaired-source
          path: app/lib
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error