name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/

      - name: Fix remaining v2590 Dart compile errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              s = p.read_text()
              old = s
              for a, b in replacements:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s)
                  print(f'patched {path}')
              else:
                  print(f'no changes needed: {path}')

          replace('lib/video_generation_status_screen.dart', [
              ("Number(d['total'])", "_number(d['total'])"),
              ("Number(d['completed'])", "_number(d['completed'])"),
          ])

          replace('lib/shot_cards_screen.dart', [
              ("as List???[]", "as List? ?? []"),
              ("as List???[ ]", "as List? ?? []"),
          ])

          replace('lib/approved_shots_screen.dart', [
              ("ClipReviewScreen(projectId: widget.projectId, jobs: shots)", "ClipReviewScreen(projectId: widget.projectId)"),
              ("ClipReviewScreen(\n                                  projectId: widget.projectId,\n                                  jobs: shots)", "ClipReviewScreen(projectId: widget.projectId)"),
          ])
          PY

          sed -i '/if (r.statusCode < 300 && mounted) {/,/^      }$/d' lib/production_plan_review_screen.dart
          dart format lib

      - name: Verify Dart source
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
