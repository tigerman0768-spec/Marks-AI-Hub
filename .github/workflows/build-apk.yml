name: Build Mark's AI APK v2590 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/
      - name: Enforce v2590 Dart repairs
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Fix malformed Number(...) calls in video_generation_status_screen.dart.
          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"Number\s*\(\s*d\s*\[\s*['\"]total['\"]\s*\]\s*\)", "_number(d['total'])", s)
              s = re.sub(r"Number\s*\(\s*d\s*\[\s*['\"]completed['\"]\s*\]\s*\)", "_number(d['completed'])", s)
              if 'num _number(dynamic x)' not in s:
                  s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # 2) Replace the entire corrupted shot-list assignment with valid Dart.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              replacement = "shots = ((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e as Map)).toList();"
              lines = s.splitlines()
              out = []
              replaced = False
              i = 0
              while i < len(lines):
                  if re.match(r'^\s*shots\s*=\s*\(\s*d\[', lines[i]):
                      while i < len(lines) and ';' not in lines[i]:
                          i += 1
                      if i < len(lines):
                          i += 1
                      out.append('    ' + replacement)
                      replaced = True
                      continue
                  out.append(lines[i])
                  i += 1
              s = '\n'.join(out) + ('\n' if s.endswith('\n') else '')
              if not replaced:
                  s = s.replace("shots=(d['shots'] as List???[1]).map((e)=>Map<String,dynamic>.from(e)).toList();", replacement)
              p.write_text(s)

          # 3) ClipReviewScreen does not define a jobs parameter.
          p = Path('lib/approved_shots_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r',\s*jobs\s*:\s*shots', '', s)
              p.write_text(s)

          # 4) Preserve the earlier v2590 syntax repairs.
          p = Path('lib/film_library_screen.dart')
          if p.exists():
              s = p.read_text().replace("    });\n  ]));", "    })),\n  ]));")
              p.write_text(s)

          p = Path('lib/smart_clip_review_screen.dart')
          if p.exists():
              s = p.read_text().replace("        })))\n  ]));", "        })),\n  ]));")
              p.write_text(s)

          p = Path('lib/production_plan_review_screen.dart')
          if p.exists():
              s = p.read_text()
              bad = "      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n    }"
              s = s.replace(bad, "    }")
              marker = "      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n            content: Text(r.statusCode < 300\n                ? (configured\n                    ? 'Video generation started'\n                    : 'Video generation plan created (dry run)')\n                : 'Video generation failed (${r.statusCode}')),\n      );"
              if marker in s and "VideoGenerationStatusScreen(projectId: widget.projectId)" not in s:
                  insert = marker + "\n      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }"
                  s = s.replace(marker, insert)
              p.write_text(s)
          PY
          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart lib/film_library_screen.dart lib/smart_clip_review_screen.dart lib/production_plan_review_screen.dart
          echo '--- repaired-source verification ---'
          ! grep -nE "Number\s*\(|List\?\?\?|List\?\?\?\[|jobs\s*:\s*shots" lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
