name: Build Mark's AI APK v2590 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Enforce v2590 Dart repairs
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # video_generation_status_screen.dart: Dart has no Number(...) constructor.
          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\bNumber\s*\(\s*d\s*\[\s*(['\"])(total|completed)\1\s*\]\s*\)", lambda m: "_number(d['%s'])" % m.group(2), s)
              if 'num _number(dynamic x)' not in s:
                  s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # shot_cards_screen.dart: repair the corrupted List???[1] cast/index expression.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              replacement = "shots = ((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e as Map)).toList();"
              s = re.sub(r"(?m)^\s*shots\s*=.*?;", '  ' + replacement, s, count=1)
              p.write_text(s)

          # approved_shots_screen.dart: ClipReviewScreen has no jobs named argument.
          p = Path('lib/approved_shots_screen.dart')
          if p.exists():
              s = re.sub(r",\s*jobs\s*:\s*shots", '', p.read_text())
              p.write_text(s)

          # Remove other known v2590 corruption tokens anywhere in lib, but do not
          # alter already-valid Dart collection literals.
          for p in Path('lib').rglob('*.dart'):
              s = p.read_text()
              s = s.replace('List???[1]', 'List?')
              s = s.replace('Map???[1]', 'Map?')
              p.write_text(s)
          PY

          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart
          echo '--- repaired-source verification ---'
          if grep -nE "Number\s*\(|List\?\?\?\[|Map\?\?\?\[|jobs\s*:\s*shots" lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart; then
            echo 'ERROR: known corrupted Dart remains'
            exit 1
          fi
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload repaired source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-repaired-source
          path: app/lib
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
