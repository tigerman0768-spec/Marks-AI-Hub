name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/

      - name: Repair v2590 Dart source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('lib').rglob('*.dart'):
              s = p.read_text()
              old = s

              # Exact repairs first, then tolerant regex repairs for generated variants.
              s = s.replace("Number(d['total'])", "(num.tryParse('${d['total']}') ?? 0)")
              s = s.replace("Number(d['completed'])", "(num.tryParse('${d['completed']}') ?? 0)")
              s = re.sub(r"\bNumber\(\s*d\s*\[\s*['\"]total['\"]\s*\]\s*\)", "(num.tryParse('${d[\"total\"]}') ?? 0)", s)
              s = re.sub(r"\bNumber\(\s*d\s*\[\s*['\"]completed['\"]\s*\]\s*\)", "(num.tryParse('${d[\"completed\"]}') ?? 0)", s)

              # Repair every malformed List??? variant seen in v2590 generation.
              s = s.replace("as List???[ ]", "as List? ?? []")
              s = s.replace("as List???[]", "as List? ?? []")
              s = s.replace("as List??? [ ]", "as List? ?? []")
              s = re.sub(r"as\s+List\?\?\?\s*\[\s*\]", "as List? ?? []", s)

              # ClipReviewScreen no longer accepts the stale jobs argument.
              s = s.replace("ClipReviewScreen(projectId: widget.projectId, jobs: shots)", "ClipReviewScreen(projectId: widget.projectId)")
              s = re.sub(r"ClipReviewScreen\(\s*projectId:\s*widget\.projectId\s*,\s*jobs:\s*shots\s*\)", "ClipReviewScreen(projectId: widget.projectId)", s)

              if s != old:
                  p.write_text(s)

          # Repair known generated-parenthesis mistakes.
          p = Path('lib/film_library_screen.dart')
          if p.exists():
              s = p.read_text().replace("    });\n  ]));\n}", "    }))\n  ]));\n}")
              p.write_text(s)

          p = Path('lib/smart_clip_review_screen.dart')
          if p.exists():
              s = p.read_text().replace("        })))\n  ]));", "        }))\n  ]));")
              p.write_text(s)

          p = Path('lib/production_plan_review_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\n\s*if \(r\.statusCode < 300 && mounted\) \{\n\s*Navigator\.push\(.*?VideoGenerationStatusScreen\(projectId: widget\.projectId\)\)\);\n\s*\}\n", "\n", s, flags=re.S)
              p.write_text(s)

          # Never reach the APK compiler with these known source defects still present.
          bad = []
          for p in Path('lib').rglob('*.dart'):
              text = p.read_text()
              if 'Number(d[' in text or 'List???' in text:
                  bad.append(str(p))
              if re.search(r'ClipReviewScreen\([^)]*jobs\s*:', text, re.S):
                  bad.append(str(p))
          if bad:
              print('Known v2590 source defects remain in:')
              print('\n'.join(sorted(set(bad))))
              raise SystemExit(1)
          PY
          dart format lib
          flutter pub get
          dart analyze --no-fatal-infos

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android project is missing; generating the Android host with Flutter."
            flutter create --platforms=android --no-pub .
          fi
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: Flutter did not create AndroidManifest.xml"
            exit 1
          fi

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              if start == -1 or end == -1:
                  raise SystemExit('Malformed AndroidManifest.xml')
              s = s[:end+1] + '\n        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end+1:]
          manifest.write_text(s)

          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.suffix not in ('.java', '.kt'):
                      continue
                  text = p.read_text()
                  text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                  text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                  text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                  text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                  p.write_text(text)
          PY
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then
            echo 'ERROR: remaining Android V1 embedding reference found'
            exit 1
          fi

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
