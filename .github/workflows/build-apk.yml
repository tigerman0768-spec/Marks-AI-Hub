name: Build Mark's AI APK v2590

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mark's AI v2590
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Repair v2590 Dart compile blockers
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('lib')

          def edit(name, fn):
              p = root / name
              if not p.exists():
                  return
              s = p.read_text()
              s2 = fn(s)
              if s2 != s:
                  p.write_text(s2)
                  print('repaired', name)

          # Numeric helper and malformed nullable collection syntax.
          edit('video_generation_status_screen.dart', lambda s: re.sub(r'\bNumber\s*\(', '_number(', s))
          p = root / 'video_generation_status_screen.dart'
          if p.exists():
              s = p.read_text()
              if 'num _number(dynamic x)' not in s:
                  s += "\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)
          for p in root.glob('*.dart'):
              s = p.read_text()
              s = s.replace('List???[1]', 'List?').replace('List???[]', 'List?').replace('List???', 'List?')
              s = s.replace('Map???[1]', 'Map?').replace('Map???{}', 'Map?').replace('Map???', 'Map?')
              p.write_text(s)

          # Existing targeted repairs.
          edit('approved_shots_screen.dart', lambda s: re.sub(r',\s*jobs\s*:\s*shots', '', s))
          edit('ai_film_assembler_screen.dart', lambda s: s.replace('        ])));\n  }', '        ]))));\n  }'))
          edit('real_clip_generation_screen.dart', lambda s: s.replace('double.tryParse(duration.text)||5', 'double.tryParse(duration.text) ?? 5'))
          edit('film_library_screen.dart', lambda s: s.replace("onPressed:()=>{search.clear(),load()}", "onPressed:(){search.clear();load();}"))
          edit('film_projects_screen.dart', lambda s: s.replace('Wrap(mainAxisSize:MainAxisSize.min,children:[', 'Wrap(children:['))
          edit('smart_one_click_final_render_screen.dart', lambda s: s.replace("(progress!['progress'] as num?)?.toDouble().clamp(0,100)/100", "(((progress!['progress'] as num?)?.toDouble() ?? 0).clamp(0,100))/100"))
          edit('timeline_audio_panel.dart', lambda s: s.replace('      ]));\n}', '      ])));\n}'))

          def review_fix(s, list_key, review_key, decision_key):
              s = s.replace(f"(data['{list_key}'] as List?).map((x) => Map<String, dynamic>.from(x))", f"((data['{list_key}'] as List?) ?? const []).map((x) => Map<String, dynamic>.from(x))")
              s = s.replace(f"(data['{review_key}'] as Map?)", f"((data['{review_key}'] as Map?) ?? const {{}})")
              s = s.replace(f"(rev['{decision_key}'] as List?).map((x) => Map<String, dynamic>.from(x))", f"((rev['{decision_key}'] as List?) ?? const []).map((x) => Map<String, dynamic>.from(x))")
              return s
          edit('canonical_timeline_review_screen.dart', lambda s: review_fix(s, 'timeline', 'review', 'itemDecisions'))
          edit('final_cut_review_screen.dart', lambda s: review_fix(s, 'clips', 'review', 'decisions'))

          p = root / 'video_generation_launch_screen.dart'
          if p.exists():
              s = p.read_text().replace('Map<String, dynamic>? launch;', 'Map<String, dynamic>? launchResult;')
              s = s.replace('launch = jsonDecode(r.body)', 'launchResult = jsonDecode(r.body)')
              s = s.replace('if (launch != null)', 'if (launchResult != null)')
              for key in ['status','shotCount','dryRun','message']:
                  s = s.replace(f"launch!['{key}']", f"launchResult!['{key}']")
              p.write_text(s)

          # Remaining compile blockers from the v2590 build log.
          edit('film_library_screen.dart', lambda s: s.replace('     ]));\n    }));', '     ])));\n    });'))

          edit('shot_cards_screen.dart', lambda s: s.replace("shots=(d['shots'] as List?).map((e)=>Map<String,dynamic>.from(e)).toList();", "shots=((d['shots'] as List?) ?? const []).map((e)=>Map<String,dynamic>.from(e)).toList();").replace('      })),]) ;', '      })),]));'))

          edit('dialogue_timeline_screen.dart', lambda s: s.replace("$projectId/screenplay/extract-dialogue", "${widget.projectId}/screenplay/extract-dialogue").replace("$projectId/dialogue/acting-direction", "${widget.projectId}/dialogue/acting-direction").replace('        });\n}', '        }));\n}'))

          edit('smart_clip_review_screen.dart', lambda s: s.replace('        }))\n  );', '        })))\n  ]));'))

          # Release Build Center: fix conditional-expression precedence and missing Scaffold close.
          def fix_release(s):
              s = s.replace("d?['configured']==true", "(d?['configured'] == true)")
              s = s.replace("Text(d?['message']??'':'—')", "Text((d?['message'] ?? '—').toString())")
              s = s.replace("Text(d?['version']??'v2570')", "Text((d?['version'] ?? 'v2570').toString())")
              s = s.replace('      ]);\n  }\n}', '      ]));\n  }\n}')
              return s
          edit('release_build_center_screen.dart', fix_release)

          # Repair the production-plan success navigation; the old generated catch block referenced r out of scope.
          p = root / 'production_plan_review_screen.dart'
          if p.exists():
              s = p.read_text()
              old = """      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n            content: Text(r.statusCode < 300\n                ? (configured\n                    ? 'Video generation started'\n                    : 'Video generation plan created (dry run)')\n                : 'Video generation failed (${r.statusCode})')),\n      );\n    } catch (e) {\n      if (mounted)\n        ScaffoldMessenger.of(context).showSnackBar(\n            SnackBar(content: Text('Video generation failed: $e')));\n      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n    }\n"""
              new = """      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n            content: Text(configured\n                ? 'Video generation started'\n                : 'Video generation plan created (dry run)')),\n      );\n      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n    } catch (e) {\n      if (mounted)\n        ScaffoldMessenger.of(context).showSnackBar(\n            SnackBar(content: Text('Video generation failed: $e')));\n    }\n"""
              if old in s:
                  s = s.replace(old, new)
              p.write_text(s)

          # Replace the malformed generated AI shot analysis screen with a valid equivalent.
          (root / 'ai_shot_content_analysis_screen.dart').write_text('''import 'dart:convert';\nimport 'package:flutter/material.dart';\nimport 'package:http/http.dart' as http;\n\nclass AiShotContentAnalysisScreen extends StatefulWidget {\n  final String projectId;\n  const AiShotContentAnalysisScreen({super.key, required this.projectId});\n  @override\n  State<AiShotContentAnalysisScreen> createState() => _AiShotContentAnalysisScreenState();\n}\n\nclass _AiShotContentAnalysisScreenState extends State<AiShotContentAnalysisScreen> {\n  static const base = 'http://10.0.2.2:3000';\n  bool loading = true;\n  Map<String, dynamic>? data;\n\n  @override\n  void initState() {\n    super.initState();\n    load();\n  }\n\n  Future<void> load() async {\n    if (mounted) setState(() => loading = true);\n    try {\n      final r = await http.get(Uri.parse('$base/api/projects/${widget.projectId}/shot-content-analysis'));\n      if (r.statusCode < 300) {\n        data = Map<String, dynamic>.from(jsonDecode(r.body));\n      }\n    } catch (_) {}\n    if (mounted) setState(() => loading = false);\n  }\n\n  Future<void> apply() async {\n    final r = await http.post(Uri.parse('$base/api/projects/${widget.projectId}/shot-content-analysis/apply'));\n    if (mounted && r.statusCode < 300) {\n      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Shot analysis saved to project')));\n      await load();\n    }\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    final items = (data?['items'] as List?) ?? const [];\n    return Scaffold(\n      appBar: AppBar(title: const Text('AI Shot Content Analysis')),\n      body: loading\n          ? const Center(child: CircularProgressIndicator())\n          : Column(\n              children: [\n                Padding(\n                  padding: const EdgeInsets.all(12),\n                  child: SizedBox(\n                    width: double.infinity,\n                    child: FilledButton.icon(\n                      onPressed: apply,\n                      icon: const Icon(Icons.visibility),\n                      label: const Text('ANALYSE & SAVE'),\n                    ),\n                  ),\n                ),\n                Padding(\n                  padding: const EdgeInsets.symmetric(horizontal: 12),\n                  child: Align(\n                    alignment: Alignment.centerLeft,\n                    child: Text('${data?['analysedCount'] ?? items.length} shots analysed'),\n                  ),\n                ),\n                Expanded(\n                  child: ListView.builder(\n                    itemCount: items.length,\n                    itemBuilder: (context, i) {\n                      final x = Map<String, dynamic>.from(items[i] as Map);\n                      final a = Map<String, dynamic>.from((x['analysis'] as Map?) ?? const {});\n                      return Card(\n                        child: ListTile(\n                          leading: CircleAvatar(child: Text('${x['shotNumber'] ?? i + 1}')),\n                          title: Text('${a['contentType'] ?? 'Shot'} • complexity ${a['visualComplexity'] ?? '—'}'),\n                          subtitle: Text('Recommended hold ${a['recommendedHold'] ?? '—'}s • confidence ${a['confidence'] ?? '—'}'),\n                        ),\n                      );\n                    },\n                  ),\n                ),\n              ],\n            ),\n    );\n  }\n}\n''')

          import subprocess
          subprocess.run(['dart', 'format', 'lib'], check=False)
          PY

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload source for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-source-fixed
          path: app/lib
