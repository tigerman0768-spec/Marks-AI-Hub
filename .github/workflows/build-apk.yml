name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path('lib')
          files = list(lib.rglob('*.dart'))

          # The v2590 archive contains a few generated Dart fragments with
          # JavaScript-style Number(...) calls and malformed nullable casts.
          for p in files:
              s = p.read_text()

              # Number(value) is not a Dart core function. Use a local helper.
              if 'Number(' in s:
                  s = s.replace('Number(', '_number(')

              # Repair malformed nullable List/Map cast fragments such as
              # List???[] and Map???{} that were introduced into the archive.
              s = re.sub(r'List\?+\s*\[\s*\]', 'List?', s)
              s = re.sub(r'Map\?+\s*\{\s*\}', 'Map?', s)
              s = re.sub(r'as\s+List\?+\s*\[\s*\]', 'as List?', s)
              s = re.sub(r'as\s+Map\?+\s*\{\s*\}', 'as Map?', s)

              # v2590 ClipReviewScreen takes projectId only; remove the stale
              # jobs positional/named argument from old callers.
              s = re.sub(r',\s*jobs\s*:\s*shots(?=\s*\))', '', s)

              p.write_text(s)

          # Replace the known malformed shot-card assignment as a whole line.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              lines = p.read_text().splitlines()
              out = []
              for line in lines:
                  if re.search(r'\bshots\s*=', line):
                      indent = re.match(r'\s*', line).group(0)
                      out.append(indent + "shots = ((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e)).toList();")
                  else:
                      out.append(line)
              p.write_text('\n'.join(out) + '\n')

          # Add the number helper to every file that uses it. Keeping it local
          # avoids introducing a new shared dependency into the archived app.
          for p in lib.rglob('*.dart'):
              s = p.read_text()
              if '_number(' in s and 'num _number(dynamic x)' not in s:
                  s = s.rstrip() + "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
                  p.write_text(s)

          # Remove any remaining known bad constructs before the analyzer runs.
          bad = []
          for p in lib.rglob('*.dart'):
              text = p.read_text()
              if re.search(r'\bNumber\s*\(\s*d\s*\[', text):
                  bad.append(f'Number(): {p}')
              if re.search(r'List\?+\s*\[', text):
                  bad.append(f'List cast: {p}')
              if re.search(r'Map\?+\s*\{', text):
                  bad.append(f'Map cast: {p}')
              if re.search(r'ClipReviewScreen\([^)]*jobs\s*:\s*shots', text, re.S):
                  bad.append(f'ClipReview jobs: {p}')
          if bad:
              raise SystemExit('\n'.join(sorted(set(bad))))
          PY
          dart format lib
          flutter pub get
          dart analyze

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              s = s[:end+1] + '\n        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end+1:]
          manifest.write_text(s)
          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if root.exists():
                  for p in root.rglob('*'):
                      if p.suffix in ('.java', '.kt'):
                          text = p.read_text()
                          text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                          text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                          text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                          text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                          p.write_text(text)
          PY
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then exit 1; fi

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error