name: Build Mark's AI APK v2590 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/
      - name: Enforce v2590 Dart repairs
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Repair the video-generation numeric conversion if the base ZIP
          # version is still present after the source overlay.
          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text()
              s = s.replace("Number(d['total'])", "_number(d['total'])")
              s = s.replace("Number(d['completed'])", "_number(d['completed'])")
              if 'num _number(dynamic x)' not in s:
                  s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # Repair the corrupted shot-list cast seen in the v2590 build log.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              bad = re.compile(r"shots\s*=\s*\(d\['shots'\]\s+as\s+List\?\?\?\[\]\)\.map\(\(e\)=>Map<String,dynamic>\.from\(e\)\)\.toList\(\);")
              good = "shots = ((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e)).toList();"
              s = bad.sub(good, s)
              p.write_text(s)

          # ClipReviewScreen does not accept a jobs named parameter.
          p = Path('lib/approved_shots_screen.dart')
          if p.exists():
              s = p.read_text()
              s = s.replace(',jobs:shots', '')
              s = s.replace(', jobs: shots', '')
              p.write_text(s)
          PY
          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart
          echo '--- repaired-source verification ---'
          grep -n "Number(d\|List???\|jobs:shots\|jobs: shots" lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart || true
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
