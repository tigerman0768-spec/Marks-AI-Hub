name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('lib')

          p = lib / 'video_generation_status_screen.dart'
          if p.exists():
              s = p.read_text().replace('Number(', '_number(')
              if 'num _number(dynamic x)' not in s:
                  s += chr(10) + chr(10) + "num _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;" + chr(10)
              p.write_text(s)

          fixes = {
              "(data['clips'] as List???[])": "((data['clips'] as List?) ?? [])",
              "(data['review'] as Map???{})": "((data['review'] as Map?) ?? {})",
              "(rev['decisions'] as List???[])": "((rev['decisions'] as List?) ?? [])",
              "(data['timeline'] as List???[])": "((data['timeline'] as List?) ?? [])",
              "(rev['itemDecisions'] as List???[])": "((rev['itemDecisions'] as List?) ?? [])",
              "(d['shots'] as List???[])": "((d['shots'] as List?) ?? [])",
          }
          for p in lib.glob('*.dart'):
              s = p.read_text()
              for old, new in fixes.items():
                  s = s.replace(old, new)
              s = s.replace('List???', 'List?').replace('Map???', 'Map?')
              s = s.replace('List??', 'List?').replace('Map??', 'Map?')
              p.write_text(s)

          p = lib / 'shot_cards_screen.dart'
          if p.exists():
              p.write_text(p.read_text().replace(
                  "final shots = ((d['shots'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();",
                  "shots = ((d['shots'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();"))

          p = lib / 'approved_shots_screen.dart'
          if p.exists():
              p.write_text(p.read_text().replace(',jobs:shots', '').replace(', jobs: shots', ''))

          p = lib / 'ai_film_assembler_screen.dart'
          if p.exists():
              p.write_text(p.read_text().replace('        ])));', '        ]))));'))

          p = lib / 'film_library_screen.dart'
          if p.exists():
              lines = p.read_text().splitlines()
              for i in range(len(lines) - 1):
                  if lines[i].strip() == ']));' and lines[i + 1].strip() == '}));':
                      lines[i] = lines[i].replace(']));', '])));')
                      break
              p.write_text(chr(10).join(lines) + chr(10))

          bad = []
          for p in lib.glob('*.dart'):
              text = p.read_text()
              if '???' in text or 'List??' in text or 'Map??' in text:
                  bad.append(str(p))
          if bad:
              raise SystemExit('Unrepaired corruption: ' + ', '.join(bad))
          PY

      - name: Repair remaining v2590 compiler errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          lib = Path('lib')

          def replace(path, old, new):
              p = lib / path
              if p.exists():
                  p.write_text(p.read_text().replace(old, new))

          replace('film_library_screen.dart', "    }));\n  ]));", "    })));\n  ]));")
          replace('release_build_center_screen.dart', "Icon(d?['configured']==true?Icons.cloud_done:Icons.cloud_off)", "Icon(d?['configured'] == true ? Icons.cloud_done : Icons.cloud_off)")
          replace('release_build_center_screen.dart', "Text(d?['configured']==true?'GitHub Actions configured':'GitHub Actions not configured')", "Text(d?['configured'] == true ? 'GitHub Actions configured' : 'GitHub Actions not configured')")
          replace('release_build_center_screen.dart', "Text(d?['message']??'':'—')", "Text((d?['message'] ?? '—').toString())")
          replace('release_build_center_screen.dart', "Text(d?['version']??'v2570')", "Text((d?['version'] ?? 'v2570').toString())")
          replace('release_build_center_screen.dart', "onPressed:d?['configured']==true&&!dispatching?dispatch:null", "onPressed:(d?['configured'] == true && !dispatching) ? dispatch : null")
          replace('release_build_center_screen.dart', "Text(m?['message']??'Checking GitHub Actions…')", "Text((m?['message'] ?? 'Checking GitHub Actions…').toString())")
          replace('shot_cards_screen.dart', "      })),]) ;", "      })),]));")

          p = lib / 'dialogue_timeline_screen.dart'
          if p.exists():
              s = p.read_text().replace('$base/api/projects/$projectId/', '$base/api/projects/' + chr(36) + '{widget.projectId}/')
              s = s.replace("        });\n}", "        });\n  );\n}")
              p.write_text(s)

          replace('smart_clip_review_screen.dart', "        }))\n  );", "        })),\n      ]));\n  );")

          p = lib / 'ai_shot_content_analysis_screen.dart'
          if p.exists():
              p.write_bytes(base64.b64decode(""))

          replace('film_projects_screen.dart', "Wrap(mainAxisSize:MainAxisSize.min,children:[", "Wrap(children:[")

          p = lib / 'production_plan_review_screen.dart'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\n\s*if \(r\.statusCode < 300 && mounted\) \{\n\s*Navigator\.push\([^\n]+\);\n\s*\}", "", s, count=1)
              p.write_text(s)

          replace('smart_one_click_final_render_screen.dart', "(progress!['progress'] as num?)?.toDouble().clamp(0,100)/100", "((progress?['progress'] as num?)?.toDouble() ?? 0).clamp(0,100) / 100")
          PY

      - name: Final v2590 compiler repairs
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          lib=Path('lib')
          def rep(path, old, new):
              p=lib/path
              if p.exists(): p.write_text(p.read_text().replace(old,new))
          rep('film_library_screen.dart','     ])));\n    })));','     ]));\n    }));')
          rep('release_build_center_screen.dart',"Icon(d?['configured']==true?Icons.cloud_done:Icons.cloud_off)","Icon(d?['configured'] == true ? Icons.cloud_done : Icons.cloud_off)")
          rep('release_build_center_screen.dart',"Text(d?['configured']==true?'GitHub Actions configured':'GitHub Actions not configured')","Text(d?['configured'] == true ? 'GitHub Actions configured' : 'GitHub Actions not configured')")
          rep('release_build_center_screen.dart',"Text(d?['message']??'':'—')","Text((d?['message'] ?? '—').toString())")
          rep('release_build_center_screen.dart',"Text(d?['version']??'v2570')","Text((d?['version'] ?? 'v2570').toString())")
          rep('release_build_center_screen.dart',"onPressed:d?['configured']==true&&!dispatching?dispatch:null","onPressed:(d?['configured'] == true && !dispatching) ? dispatch : null")
          rep('release_build_center_screen.dart',"Text(m?['message']??'Checking GitHub Actions…')","Text((m?['message'] ?? 'Checking GitHub Actions…').toString())")
          rep('release_build_center_screen.dart',"      ]);\n  }\n}","      ]));\n  }\n}")
          rep('shot_cards_screen.dart','      })),]) ;','      })),]));')
          p=lib/'dialogue_timeline_screen.dart'
          if p.exists(): p.write_text(p.read_text().replace(chr(36)+'projectId',chr(36)+'{widget.projectId}'))
          rep('smart_clip_review_screen.dart',"      ]));\n  );\n}","      ]));\n}")
          rep('film_projects_screen.dart','Wrap(mainAxisSize:MainAxisSize.min,children:[','Wrap(children:[')
          rep('smart_one_click_final_render_screen.dart',"(progress!['progress'] as num?)?.toDouble().clamp(0,100)/100","((progress?['progress'] as num?)?.toDouble() ?? 0).clamp(0,100) / 100")
          p=lib/'production_plan_review_screen.dart'
          if p.exists():
              s=p.read_text()
              s=re.sub(r"\n\s*if \(r\.statusCode < 300 && mounted\) \{\n\s*Navigator\.push\([^\n]+\);\n\s*\}","",s,count=1)
              p.write_text(s)
          p=lib/'ai_shot_content_analysis_screen.dart'
          if p.exists(): p.write_bytes(base64.b64decode(""))
          PY

      - name: Final syntax corrections
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lib=Path('lib')
          def rep(path, old, new):
              p=lib/path
              if p.exists():
                  p.write_text(p.read_text().replace(old,new))
          rep('film_library_screen.dart', '     ]));\n    }));', '     ])));\n    }));')
          rep('dialogue_timeline_screen.dart', '        });\n  );\n}', '        },\n      );\n  );\n}')
          rep('ai_shot_content_analysis_screen.dart', "shot-content-analysis/save/apply", "shot-content-analysis/apply")
          rep('ai_shot_content_analysis_screen.dart', 'EdgeInsets.sall', 'EdgeInsets.all')
          PY
      - name: Final source cleanup
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          Path('lib/dialogue_timeline_screen.dart').write_bytes(zlib.decompress(base64.b64decode("")))
          def rep(path, old, new):
              p=Path('lib')/path
              if p.exists(): p.write_text(p.read_text().replace(old,new))
          rep('film_library_screen.dart', '     ]));\n    }));', '     ])));\n    }));')
          rep('ai_shot_content_analysis_screen.dart', "shot-content-analysis/save/apply", "shot-content-analysis/apply")
          rep('ai_shot_content_analysis_screen.dart', 'EdgeInsets.sall', 'EdgeInsets.all')
          PY

      - name: Package repaired source correctly for debugging
        if: always()
        working-directory: app
        run: |
          rm -f ../Marks-AI-v2590-source-debug.zip
          zip -qr ../Marks-AI-v2590-source-debug.zip lib pubspec.yaml

      - name: Upload repaired source debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-source-debug
          path: Marks-AI-v2590-source-debug.zip
          if-no-files-found: error

      - name: Diagnose and format Dart source
        working-directory: app
        continue-on-error: true
        run: |
          dart format lib > ../format.log 2>&1
          flutter pub get >> ../format.log 2>&1
          flutter analyze --no-fatal-infos --no-fatal-warnings > ../analyze.log 2>&1
          dart analyze lib >> ../analyze.log 2>&1

      - name: Package diagnostics
        if: always()
        working-directory: app
        run: |
          zip -qr ../Marks-AI-v2590-diagnostics.zip lib pubspec.yaml ../format.log ../analyze.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-diagnostics
          path: Marks-AI-v2590-diagnostics.zip
          if-no-files-found: error

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              s = s[:end + 1] + chr(10) + '        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end + 1:]
          manifest.write_text(s)
          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if root.exists():
                  for p in root.rglob('*'):
                      if p.suffix in ('.java', '.kt'):
                          text = p.read_text()
                          text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                          text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                          text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                          text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                          p.write_text(text)
          PY
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then exit 1; fi

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
