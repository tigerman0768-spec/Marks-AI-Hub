name: Build Mark's AI APK v2590 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/
      - name: Enforce v2590 Dart repairs
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Dart has num.parse/tryParse, not the malformed Number(...) calls.
          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\bNumber\s*\(\s*d\s*\[\s*['\"]total['\"]\s*\]\s*\)", "_number(d['total'])", s)
              s = re.sub(r"\bNumber\s*\(\s*d\s*\[\s*['\"]completed['\"]\s*\]\s*\)", "_number(d['completed'])", s)
              if 'num _number(dynamic x)' not in s:
                  s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # 2) Replace the corrupted shot-list expression regardless of the
          # exact List??? corruption inserted into the v2590 source.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              replacement = "shots = ((d['shots'] as List?) ?? const []).map((e) => Map<String, dynamic>.from(e as Map)).toList();"
              pattern = r"(?m)^\s*shots\s*=\s*\(\s*d\s*\[\s*['\"]shots['\"]\s*\]\s+as\s+List[^\n]*?\.map\(\(e\)\s*=>\s*Map<String\s*,\s*dynamic>\.from\(e\)\)[^\n]*?;"
              s2, n = re.subn(pattern, replacement, s)
              if n == 0:
                  pattern2 = r"(?ms)^\s*shots\s*=.*?\.toList\(\);"
                  s2, n = re.subn(pattern2, replacement, s, count=1)
              p.write_text(s2)

          # 3) ClipReviewScreen has no jobs named parameter.
          p = Path('lib/approved_shots_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r",\s*jobs\s*:\s*shots", "", s)
              p.write_text(s)

          # 4) Repair the next compile blockers exposed by the previous build.
          p = Path('lib/film_library_screen.dart')
          if p.exists():
              s = p.read_text()
              s = s.replace("    });\n  ]));", "    })),\n  ]));")
              p.write_text(s)

          p = Path('lib/smart_clip_review_screen.dart')
          if p.exists():
              s = p.read_text()
              s = s.replace("        })))\n  ]));", "        })),\n  ]));")
              p.write_text(s)

          p = Path('lib/production_plan_review_screen.dart')
          if p.exists():
              s = p.read_text()
              bad = "      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n    }"
              s = s.replace(bad, "    }")
              marker = "      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n            content: Text(r.statusCode < 300\n                ? (configured\n                    ? 'Video generation started'\n                    : 'Video generation plan created (dry run)')\n                : 'Video generation failed (${r.statusCode})')),\n      );"
              insert = marker + "\n      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }"
              s = s.replace(marker, insert)
              p.write_text(s)
          PY
          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart lib/film_library_screen.dart lib/smart_clip_review_screen.dart lib/production_plan_review_screen.dart
          echo '--- repaired-source verification ---'
          grep -nE "Number\s*\(|List\?\?\?|jobs\s*:\s*shots" lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart || true
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
