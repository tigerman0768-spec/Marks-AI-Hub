name: Build Mark's AI APK v2590

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mark's AI v2590
        run: |
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Fix Flutter split-per-abi flag syntax
        working-directory: app
        run: |
          # Flutter treats --split-per-abi as a boolean flag; it must not be
          # passed a value such as --split-per-abi=false.
          if [ -f tools/build_apk.sh ]; then
            sed -i -E 's/--split-per-abi[= ]+false/--no-split-per-abi/g' tools/build_apk.sh
          fi

      - name: Build release APK
        working-directory: app
        run: |
          chmod +x tools/build_apk.sh
          ./tools/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
