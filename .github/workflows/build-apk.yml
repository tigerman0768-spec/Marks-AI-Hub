name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path('lib')

          # Repair the known generated-code issues without touching unrelated Dart code.
          for p in lib.rglob('*.dart'):
              s = p.read_text()
              # The source contains calls such as Number(d['total']), but no compatible
              # positional Number constructor exists. Convert these to our safe parser.
              s = re.sub(r'\bNumber\s*\(([^()\n]*)\)', r'_number(\1)', s)
              # Repair corrupted nullable collection syntax produced in v2590.
              s = re.sub(r'List\?+\s*\[\s*\]', 'List?', s)
              s = re.sub(r'Map\?+\s*\{\s*\}', 'Map?', s)
              s = re.sub(r'as\s+List\?+\s*\[\s*\]', 'as List?', s)
              s = re.sub(r'as\s+Map\?+\s*\{\s*\}', 'as Map?', s)
              # ClipReviewScreen no longer accepts a jobs named argument.
              s = re.sub(r',\s*jobs\s*:\s*shots(?=\s*\))', '', s)
              p.write_text(s)

          # Rewrite the entire malformed shots assignment in the affected screen.
          p = lib / 'shot_cards_screen.dart'
          if p.exists():
              lines = p.read_text().splitlines()
              out = []
              replacing = False
              for line in lines:
                  if not replacing and re.search(r'\bshots\s*=\s*\(d\[.shots.\]', line):
                      indent = line[:len(line)-len(line.lstrip())]
                      out.append(indent + "shots = ((d['shots'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();")
                      replacing = True
                      if ';' in line[line.find('=')+1:]:
                          replacing = False
                      continue
                  if replacing:
                      if ';' in line:
                          replacing = False
                      continue
                  out.append(line)
              p.write_text('\n'.join(out) + '\n')

          # Explicitly repair any remaining malformed shots assignment spanning lines.
          p = lib / 'shot_cards_screen.dart'
          if p.exists():
              s = p.read_text()
              s = re.sub(
                  r"shots\s*=\s*\(d\['shots'\][\s\S]*?\.toList\(\);",
                  "shots = ((d['shots'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();",
                  s,
                  count=1,
              )
              p.write_text(s)

          # Remove the unsupported jobs argument from approved shots screen as well.
          p = lib / 'approved_shots_screen.dart'
          if p.exists():
              s = p.read_text()
              s = re.sub(r',\s*jobs\s*:\s*shots(?=\s*\))', '', s)
              p.write_text(s)

          # Existing v2590 syntax repairs.
          p = lib / 'ai_film_assembler_screen.dart'
          if p.exists():
              s = p.read_text()
              s = s.replace("        ])));", "        ]))));")
              p.write_text(s)

          p = lib / 'film_library_screen.dart'
          if p.exists():
              lines = p.read_text().splitlines()
              for i in range(len(lines) - 1):
                  if lines[i].strip() == ']));' and lines[i+1].strip() == '}));':
                      lines[i] = lines[i].replace(']));', '])));')
                      break
              p.write_text('\n'.join(lines) + '\n')

          # Add the helper only to files that now use it.
          for p in lib.rglob('*.dart'):
              s = p.read_text()
              if '_number(' in s and 'num _number(dynamic x)' not in s:
                  s = s.rstrip() + "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
                  p.write_text(s)
          PY

          dart format lib/ai_film_assembler_screen.dart lib/film_library_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart lib/video_generation_status_screen.dart
          flutter pub get

      - name: Package repaired source for diagnostics
        if: always()
        working-directory: app
        run: |
          zip -qr ../Marks-AI-v2590-repaired-source.zip lib pubspec.yaml

      - name: Upload repaired source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-repaired-source
          path: Marks-AI-v2590-repaired-source.zip
          if-no-files-found: error

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start=s.find('<application'); end=s.find('>',start)
              s=s[:end+1]+'\n        <meta-data android:name="flutterEmbedding" android:value="2" />'+s[end+1:]
          manifest.write_text(s)
          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if root.exists():
                  for p in root.rglob('*'):
                      if p.suffix in ('.java','.kt'):
                          text=p.read_text()
                          text=text.replace('io.flutter.app.FlutterActivity','io.flutter.embedding.android.FlutterActivity')
                          text=text.replace('io.flutter.app.FlutterApplication','io.flutter.embedding.android.FlutterActivity')
                          text=re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?','',text)
                          text=re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?','',text)
                          p.write_text(text)
          PY
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then exit 1; fi

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
