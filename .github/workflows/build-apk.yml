name: Build Mark's AI APK v2590 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/
      - name: Enforce known-good v2590 Dart repairs
        working-directory: app
        run: |
          set -e
          for f in video_generation_status_screen.dart shot_cards_screen.dart approved_shots_screen.dart; do
            test -f "/tmp/fixed/$f"
            cp "/tmp/fixed/$f" "lib/$f"
          done
      - name: Fix remaining v2590 Dart syntax
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/film_library_screen.dart')
          s = p.read_text()
          s = s.replace('    });\n  ]));\n}', '    }))\n  ]));\n}')
          p.write_text(s)

          p = Path('lib/smart_clip_review_screen.dart')
          s = p.read_text().replace('        })))\n  ]));', '        }))\n  ]));')
          p.write_text(s)

          p = Path('lib/production_plan_review_screen.dart')
          s = p.read_text()
          old = """    } catch (e) {\n      if (mounted)\n        ScaffoldMessenger.of(context).showSnackBar(\n            SnackBar(content: Text('Video generation failed: $e')));\n      if (r.statusCode < 300 && mounted) {\n        Navigator.push(\n            context,\n            MaterialPageRoute(\n                builder: (_) =>\n                    VideoGenerationStatusScreen(projectId: widget.projectId)));\n      }\n    }\n"""
          new = """    } catch (e) {\n      if (mounted)\n        ScaffoldMessenger.of(context).showSnackBar(\n            SnackBar(content: Text('Video generation failed: $e')));\n    }\n"""
          if old not in s:
              raise SystemExit('production_plan_review_screen.dart repair pattern not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          dart format lib/film_library_screen.dart lib/smart_clip_review_screen.dart lib/production_plan_review_screen.dart
          echo '--- remaining-source verification ---'
          if grep -nE "r\.statusCode < 300 && mounted|^\s*\}\)\)\)$" lib/film_library_screen.dart lib/smart_clip_review_screen.dart lib/production_plan_review_screen.dart; then
            echo 'ERROR: known remaining Dart corruption found'
            exit 1
          fi
      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh
      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
