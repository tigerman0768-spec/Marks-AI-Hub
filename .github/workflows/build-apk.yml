name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2590 project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Repair known v2590 Dart errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lib = Path('lib')

          p = lib / 'video_generation_status_screen.dart'
          if p.exists():
              s = p.read_text()
              s = s.replace("Number(d['total'])", "num.tryParse(d['total'].toString()) ?? 0")
              s = s.replace("Number(d['completed'])", "num.tryParse(d['completed'].toString()) ?? 0")
              p.write_text(s)

          for p in lib.glob('*.dart'):
              s = p.read_text()
              s = s.replace('List???[]', 'List? ?? []')
              s = s.replace('Map???{}', 'Map? ?? {}')
              p.write_text(s)

          p = lib / 'approved_shots_screen.dart'
          if p.exists():
              s = p.read_text()
              s = re.sub(r',\s*jobs\s*:\s*shots', '', s)
              p.write_text(s)

          bad = []
          for p in lib.glob('*.dart'):
              if '???' in p.read_text():
                  bad.append(str(p))
          if bad:
              raise SystemExit('Unrepaired ??? corruption: ' + ', '.join(bad))
          PY
          dart format lib

      - name: Analyze v2590
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --split-per-abi=false

      - name: Verify and stage APK
        working-directory: app
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/install
          cp build/app/outputs/flutter-apk/app-release.apk build/install/Mark_s_AI_v2590.apk
          sha256sum build/install/Mark_s_AI_v2590.apk | tee build/install/Mark_s_AI_v2590.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: |
            app/build/install/Mark_s_AI_v2590.apk
            app/build/install/Mark_s_AI_v2590.apk.sha256
          if-no-files-found: error
