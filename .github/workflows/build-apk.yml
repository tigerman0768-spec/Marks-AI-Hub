name: Build Mark's AI APK v2590

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mark's AI v2590
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Repair known v2590 Dart compile errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(name, fn):
              p = Path('lib') / name
              s = p.read_text()
              s2 = fn(s)
              if s2 != s:
                  p.write_text(s2)
                  print(f'repaired {name}')

          # video_generation_status_screen.dart: generated JavaScript-style
          # Number(...) calls are not valid Dart numeric conversion calls.
          edit('video_generation_status_screen.dart', lambda s: re.sub(r'\bNumber\s*\(', '_number(', s))
          p = Path('lib/video_generation_status_screen.dart')
          s = p.read_text()
          if 'num _number(dynamic x)' not in s:
              s += "\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # Repair malformed nullable collection placeholders in the generated source.
          for name in ['shot_cards_screen.dart', 'canonical_timeline_review_screen.dart', 'final_cut_review_screen.dart']:
              edit(name, lambda s: re.sub(r'List\?+\s*\[[^\]]*\]', 'List?', re.sub(r'Map\?+\s*\{[^}]*\}', 'Map?', s)).replace('List???[]', 'List?').replace('Map???{}', 'Map?'))

          # ClipReviewScreen no longer has a jobs named parameter.
          edit('approved_shots_screen.dart', lambda s: re.sub(r',\s*jobs\s*:\s*shots', '', s))

          # Generated async callbacks incorrectly used arrow syntax for two statements.
          # Dart arrow bodies accept one expression; use a block callback instead.
          for p in Path('lib').glob('*.dart'):
              s = p.read_text()
              s2 = re.sub(
                  r'setState\(\(\)\s*=>\s*([^;\n]+);\s*busy\s*=\s*false\);',
                  r'setState(() { \1; busy = false; });',
                  s,
              )
              if s2 != s:
                  p.write_text(s2)
                  print(f'repaired setState callback in {p.name}')

          # Format only the files explicitly repaired above. Do not run dart format
          # over every generated screen: v2590 contains legacy/unreachable source
          # fragments that are not part of the application import graph.
          PY

          dart format \
            lib/video_generation_status_screen.dart \
            lib/shot_cards_screen.dart \
            lib/canonical_timeline_review_screen.dart \
            lib/final_cut_review_screen.dart \
            lib/approved_shots_screen.dart

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: |
          chmod +x tools/build_apk.sh
          ./tools/build_apk.sh

      - name: Upload source for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-source
          path: app/lib
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
