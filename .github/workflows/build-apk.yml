name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/

      - name: Fix remaining v2590 Dart compile errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          def replace(path, replacements):
              p = Path(path)
              if not p.exists():
                  print(f'skip missing {path}')
                  return
              s = p.read_text()
              old = s
              for a, b in replacements:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s)
                  print(f'patched {path}')

          for p in Path('lib').glob('*.dart'):
              s = p.read_text()
              old = s
              s = s.replace("Number(d['total'])", "(num.tryParse('${d['total']}') ?? 0)")
              s = s.replace("Number(d['completed'])", "(num.tryParse('${d['completed']}') ?? 0)")
              s = re.sub(r"Number\(\s*d\s*\[\s*['\"]total['\"]\s*\]\s*\)", "(num.tryParse('${d['total']}') ?? 0)", s)
              s = re.sub(r"Number\(\s*d\s*\[\s*['\"]completed['\"]\s*\]\s*\)", "(num.tryParse('${d['completed']}') ?? 0)", s)
              s = re.sub(r"as\s+List\?\?\?\s*\[\s*\]", "as List? ?? []", s)
              s = s.replace("as List???[ ]", "as List? ?? []")
              s = s.replace("as List???[]", "as List? ?? []")
              s = s.replace("as List??? [ ]", "as List? ?? []")
              s = re.sub(r"ClipReviewScreen\(\s*projectId:\s*widget\.projectId\s*,\s*jobs:\s*shots\s*\)", "ClipReviewScreen(projectId: widget.projectId)", s)
              if s != old:
                  p.write_text(s)

          p = Path('lib/production_plan_review_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\n\s*if \(r\.statusCode < 300 && mounted\) \{\n\s*Navigator\.push\(\n\s*context,\n\s*MaterialPageRoute\(\n\s*builder: _\) =>\n\s*VideoGenerationStatusScreen\(projectId: widget\.projectId\)\)\);\n\s*\}\n", "\n", s, flags=re.S)
              p.write_text(s)

          film_b64 = ""
          Path('lib/film_library_screen.dart').write_bytes(base64.b64decode(film_b64))

          # Final closure guard for the smart clip screen.
          replace('lib/smart_clip_review_screen.dart', [
              ("        })))\n  ]));", "        }))\n  ]));"),
          ])
          PY
          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart lib/production_plan_review_screen.dart lib/film_library_screen.dart lib/smart_clip_review_screen.dart
          flutter pub get
          echo 'Running full Dart analysis before Android build...'
          dart analyze lib

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')

          s = manifest.read_text()
          original = s
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)

          if 'android:name="flutterEmbedding"' not in s:
              marker = '<application'
              start = s.find(marker)
              if start == -1:
                  raise SystemExit('No <application> element found in AndroidManifest.xml')
              end = s.find('>', start)
              if end == -1:
                  raise SystemExit('Malformed <application> element')
              s = s[:end+1] + '\n        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end+1:]

          manifest.write_text(s)
          print('AndroidManifest migrated to embedding v2' if s != original else 'AndroidManifest already uses embedding v2')

          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.suffix not in ('.java', '.kt'):
                      continue
                  text = p.read_text()
                  old = text
                  text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                  text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                  text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                  text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                  if text != old:
                      p.write_text(text)
                      print(f'migrated {p}')
          PY
          echo 'Checking for remaining V1 embedding references:'
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then
            echo 'ERROR: remaining Android V1 embedding reference found'
            exit 1
          fi
          echo 'No Android V1 embedding references remain.'

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
