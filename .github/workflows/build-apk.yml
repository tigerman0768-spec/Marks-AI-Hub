name: Build Mark's AI APK v2590

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mark's AI v2590
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Fix Flutter split-per-abi flag syntax
        working-directory: app
        run: |
          if [ -f tools/build_apk.sh ]; then
            sed -i -E 's/--no-split-per-abi//g; s/--split-per-abi[= ]*false//g' tools/build_apk.sh
          fi

      - name: Repair known v2590 Dart compile errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # video_generation_status_screen.dart: replace the JavaScript-style
          # Number(...) calls with a small Dart-safe numeric conversion helper.
          p = Path('lib/video_generation_status_screen.dart')
          s = p.read_text()
          s = s.replace('Number(', '_number(')
          if 'num _number(dynamic x)' not in s:
              s += "\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
          p.write_text(s)

          # shot_cards_screen.dart: repair the malformed nullable List syntax
          # that appears in the v2590 source as List???[].
          p = Path('lib/shot_cards_screen.dart')
          s = p.read_text()
          s = s.replace("List???[]", "List? ?? []")
          s = re.sub(
              r"\(d\['shots'\]\s+as\s+List\?\?\?\[\]\)",
              "((d['shots'] as List?) ?? [])",
              s,
          )
          p.write_text(s)

          # approved_shots_screen.dart: the current ClipReviewScreen constructor
          # does not define a jobs parameter, so remove that named argument.
          p = Path('lib/approved_shots_screen.dart')
          s = p.read_text()
          s = re.sub(r",\s*jobs\s*:\s*shots\s*\)\)", ")", s)
          s = s.replace(',jobs:shots', '')
          s = s.replace(', jobs: shots', '')
          p.write_text(s)
          PY

          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: |
          chmod +x tools/build_apk.sh
          ./tools/build_apk.sh

      - name: Upload source for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-source
          path: app/lib
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
