name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app
          mkdir -p app
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Repair v2590 Dart source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path('lib').rglob('*.dart'))

          for p in files:
              s = p.read_text()

              # Remove previously generated helpers/classes before rebuilding the helper below.
              s = re.sub(r'\n(?:num|double|int)\s+_number\(dynamic\s+x\)\s*=>[^;]*;\s*', '\n', s)
              s = re.sub(r'\nclass\s+Number\s*\{.*?\}\s*', '\n', s, flags=re.S)

              # JavaScript-style Number(d['field']) accidentally introduced into Dart.
              s = re.sub(
                  r"\bNumber\(\s*d\s*\[\s*(['\"])([A-Za-z0-9_]+)\1\s*\]\s*\)",
                  lambda m: "_number(d['%s'])" % m.group(2),
                  s,
              )

              # Repair every malformed null-aware List/Map cast variant, including
              # the exact v2590 form: List???[ ].
              s = re.sub(r"List\?+\s*\[\s*\]", "List?", s)
              s = re.sub(r"Map\?+\s*\{\s*\}", "Map?", s)
              s = re.sub(r"as\s+List\?+", "as List?", s)
              s = re.sub(r"as\s+Map\?+", "as Map?", s)

              # The shot-card data should always fall back to an empty list.
              s = re.sub(
                  r"shots\s*=\s*\(\s*d\s*\[\s*['\"]shots['\"]\s*\]\s+as\s+List\?\s*\)\s*\.map\s*\(\s*\(e\)\s*=>\s*Map<String\s*,\s*dynamic>\.from\(e\)\s*\)\s*\.toList\(\s*\)\s*;",
                  "shots=((d['shots'] as List?) ?? const []).map((e)=>Map<String,dynamic>.from(e)).toList();",
                  s,
                  flags=re.S,
              )

              # Also repair any remaining parenthesized nullable List expression before .map.
              s = re.sub(
                  r"\(\s*(d\s*\[\s*['\"]shots['\"]\s*\]\s+as\s+List\?)\s*\)\s*\.map",
                  r"((\1) ?? const []).map",
                  s,
              )

              # ClipReviewScreen in v2590 accepts projectId only; remove stale jobs arguments.
              s = s.replace(", jobs: shots", "")
              s = s.replace(",jobs: shots", "")
              s = re.sub(r"\s*,\s*jobs\s*:\s*shots\s*([,)])", r"\1", s)

              # Repair accidental single-expression setState blocks containing two statements.
              s = re.sub(
                  r"setState\(\(\)\s*=>\s*([A-Za-z_][A-Za-z0-9_]*\s*=\s*[^;]+);\s*(busy|finalizing)\s*=\s*false\);",
                  r"setState(() { \1; \2 = false; });",
                  s,
              )

              p.write_text(s)

          # Add exactly one local Dart number helper to the status screen.
          p = Path('lib/video_generation_status_screen.dart')
          if p.exists():
              s = p.read_text().rstrip()
              s += "\n\nnum _number(dynamic x) => x is num ? x : num.tryParse('$x') ?? 0;\n"
              p.write_text(s)

          # Final explicit cleanup of the known shot-card statement.
          p = Path('lib/shot_cards_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(
                  r"shots\s*=\s*\([^;\n]*d\s*\[\s*['\"]shots['\"]\s*\][^;\n]*\)\s*\.map\([^;\n]*\)\.toList\(\)\s*;",
                  "shots=((d['shots'] as List?) ?? const []).map((e)=>Map<String,dynamic>.from(e)).toList();",
                  s,
              )
              p.write_text(s)

          # Fail early if any known malformed constructs survived the repair.
          bad = []
          for p in Path('lib').rglob('*.dart'):
              text = p.read_text()
              if re.search(r"\bNumber\(\s*d\s*\[", text): bad.append(f"Number(): {p}")
              if re.search(r"List\?+\s*\[", text): bad.append(f"List cast: {p}")
              if re.search(r"Map\?+\s*\{", text): bad.append(f"Map cast: {p}")
              if re.search(r"ClipReviewScreen\([^)]*jobs\s*:\s*shots", text, re.S): bad.append(f"ClipReview jobs: {p}")
          if bad:
              print('\n'.join(sorted(set(bad))))
              raise SystemExit(1)
          PY
          dart format lib
          flutter pub get
          dart analyze

      - name: Prepare Android project
        working-directory: app
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)
          if 'android:name="flutterEmbedding"' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              s = s[:end+1] + '\n        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end+1:]
          manifest.write_text(s)
          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if root.exists():
                  for p in root.rglob('*'):
                      if p.suffix in ('.java', '.kt'):
                          text = p.read_text()
                          text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                          text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                          text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                          text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                          p.write_text(text)
          PY
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then exit 1; fi

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
