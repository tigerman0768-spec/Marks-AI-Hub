name: Build Mark's AI APK v2590 FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract base project
        run: |
          rm -rf app /tmp/fixed
          mkdir -p app /tmp/fixed
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Overlay repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10908091142/zip" -o /tmp/fixed.zip
          unzip -q /tmp/fixed.zip -d /tmp/fixed
          cp -a /tmp/fixed/. app/lib/

      - name: Fix remaining v2590 Dart compile errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, replacements):
              p = Path(path)
              if not p.exists():
                  print(f'skip missing {path}')
                  return
              s = p.read_text()
              old = s
              for a, b in replacements:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s)
                  print(f'patched {path}')

          for p in Path('lib').glob('*.dart'):
              s = p.read_text()
              old = s
              s = s.replace("Number(d['total'])", "(num.tryParse('${d['total']}') ?? 0)")
              s = s.replace("Number(d['completed'])", "(num.tryParse('${d['completed']}') ?? 0)")
              s = re.sub(r"Number\(\s*d\s*\[\s*['\"]total['\"]\s*\]\s*\)", "(num.tryParse('${d['total']}') ?? 0)", s)
              s = re.sub(r"Number\(\s*d\s*\[\s*['\"]completed['\"]\s*\]\s*\)", "(num.tryParse('${d['completed']}') ?? 0)", s)
              s = re.sub(r"as\s+List\?\?\?\s*\[\s*\]", "as List? ?? []", s)
              s = s.replace("as List???[ ]", "as List? ?? []")
              s = s.replace("as List???[]", "as List? ?? []")
              s = s.replace("as List??? [ ]", "as List? ?? []")
              s = re.sub(r"ClipReviewScreen\(\s*projectId:\s*widget\.projectId\s*,\s*jobs:\s*shots\s*\)", "ClipReviewScreen(projectId: widget.projectId)", s)
              if s != old:
                  p.write_text(s)

          p = Path('lib/production_plan_review_screen.dart')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\n\s*if \(r\.statusCode < 300 && mounted\) \{\n\s*Navigator\.push\(\n\s*context,\n\s*MaterialPageRoute\(\n\s*builder: _\) =>\n\s*VideoGenerationStatusScreen\(projectId: widget\.projectId\)\)\);\n\s*\}\n", "\n", s, flags=re.S)
              p.write_text(s)

          # Replace the malformed generated film-library screen with a clean equivalent.
          Path('lib/film_library_screen.dart').write_text(r'''import 'dart:convert';
import 'package:flutter/material.dart';
import 'package:http/http.dart' as http;
import 'film_library_player_screen.dart';
import 'film_details_screen.dart';

class FilmLibraryScreen extends StatefulWidget {
  const FilmLibraryScreen({super.key});

  @override
  State<FilmLibraryScreen> createState() => _FilmLibraryScreenState();
}

class _FilmLibraryScreenState extends State<FilmLibraryScreen> {
  static const base = 'http://10.0.2.2:3000';
  final search = TextEditingController();
  List<dynamic> films = [];
  bool loading = true;
  String sort = 'newest';
  bool favouritesOnly = false;

  @override
  void initState() {
    super.initState();
    load();
  }

  @override
  void dispose() {
    search.dispose();
    super.dispose();
  }

  Future<void> load() async {
    if (mounted) setState(() => loading = true);
    try {
      final query = <String, String>{
        if (search.text.trim().isNotEmpty) 'q': search.text.trim(),
        'sort': sort,
        'favourite': favouritesOnly.toString(),
      };
      final uri = Uri.parse('$base/api/film-library/search')
          .replace(queryParameters: query);
      final response = await http.get(uri);
      if (response.statusCode < 300) {
        final body = jsonDecode(response.body) as Map<String, dynamic>;
        films = List<dynamic>.from(body['films'] ?? const []);
      }
    } catch (_) {}
    if (mounted) setState(() => loading = false);
  }

  Future<void> favourite(String id) async {
    await http.post(Uri.parse('$base/api/film-library/$id/favourite'));
    await load();
  }

  Future<void> remove(String id) async {
    final ok = await showDialog<bool>(
      context: context,
      builder: (_) => AlertDialog(
        title: const Text('Delete film?'),
        content: const Text('This removes the film from the library record.'),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(context, false),
            child: const Text('CANCEL'),
          ),
          FilledButton(
            onPressed: () => Navigator.pop(context, true),
            child: const Text('DELETE'),
          ),
        ],
      ),
    );
    if (ok == true) {
      await http.delete(Uri.parse('$base/api/film-library/$id'));
      await load();
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('My Film Library'),
        actions: [
          IconButton(onPressed: load, icon: const Icon(Icons.refresh)),
        ],
      ),
      body: Column(
        children: [
          Padding(
            padding: const EdgeInsets.fromLTRB(12, 12, 12, 4),
            child: TextField(
              controller: search,
              onSubmitted: (_) => load(),
              decoration: InputDecoration(
                hintText: 'Search films',
                prefixIcon: const Icon(Icons.search),
                suffixIcon: IconButton(
                  onPressed: () {
                    search.clear();
                    load();
                  },
                  icon: const Icon(Icons.clear),
                ),
                border: const OutlineInputBorder(),
              ),
            ),
          ),
          Padding(
            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
            child: Row(
              children: [
                Expanded(
                  child: DropdownButtonFormField<String>(
                    initialValue: sort,
                    decoration: const InputDecoration(labelText: 'Sort'),
                    items: const [
                      DropdownMenuItem(value: 'newest', child: Text('Newest')),
                      DropdownMenuItem(value: 'oldest', child: Text('Oldest')),
                      DropdownMenuItem(value: 'title', child: Text('Title')),
                      DropdownMenuItem(
                        value: 'duration',
                        child: Text('Longest'),
                      ),
                    ],
                    onChanged: (value) {
                      if (value != null) {
                        setState(() => sort = value);
                        load();
                      }
                    },
                  ),
                ),
                const SizedBox(width: 10),
                FilterChip(
                  label: const Text('Favourites'),
                  selected: favouritesOnly,
                  onSelected: (value) {
                    setState(() => favouritesOnly = value);
                    load();
                  },
                ),
              ],
            ),
          ),
          Expanded(
            child: loading
                ? const Center(child: CircularProgressIndicator())
                : films.isEmpty
                    ? const Center(child: Text('No finished films yet.'))
                    : GridView.builder(
                        padding: const EdgeInsets.all(12),
                        gridDelegate:
                            const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 2,
                          crossAxisSpacing: 10,
                          mainAxisSpacing: 10,
                          childAspectRatio: .72,
                        ),
                        itemCount: films.length,
                        itemBuilder: (context, index) {
                          final film =
                              Map<String, dynamic>.from(films[index] as Map);
                          final id = '${film['id']}';
                          final title =
                              '${film['title'] ?? 'Untitled Film'}';
                          return Card(
                            clipBehavior: Clip.antiAlias,
                            child: InkWell(
                              onTap: () => Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) => FilmDetailsScreen(filmId: id),
                                ),
                              ),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.stretch,
                                children: [
                                  Expanded(
                                    child: Stack(
                                      children: [
                                        film['thumbnailPath'] != null &&
                                                '${film['thumbnailPath']}'
                                                    .isNotEmpty
                                            ? Image.network(
                                                '$base/api/film-library/$id/thumbnail',
                                                fit: BoxFit.cover,
                                                errorBuilder: (_, __, ___) =>
                                                    const Center(
                                                  child: Icon(
                                                    Icons.movie,
                                                    size: 52,
                                                  ),
                                                ),
                                              )
                                            : Container(
                                                color: Theme.of(context)
                                                    .colorScheme
                                                    .surfaceContainerHighest,
                                                child: const Center(
                                                  child: Icon(
                                                    Icons.movie,
                                                    size: 52,
                                                  ),
                                                ),
                                              ),
                                        Positioned(
                                          right: 4,
                                          top: 4,
                                          child: IconButton(
                                            onPressed: () => favourite(id),
                                            icon: Icon(
                                              film['favourite'] == true
                                                  ? Icons.favorite
                                                  : Icons.favorite_border,
                                            ),
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                  Padding(
                                    padding: const EdgeInsets.all(8),
                                    child: Text(
                                      title,
                                      maxLines: 2,
                                      overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(
                                        fontWeight: FontWeight.bold,
                                      ),
                                    ),
                                  ),
                                  Text(
                                    '${film['genre'] ?? ''} • ${film['style'] ?? ''}',
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                  ),
                                  Row(
                                    children: [
                                      Expanded(
                                        child: TextButton.icon(
                                          onPressed: () => Navigator.push(
                                            context,
                                            MaterialPageRoute(
                                              builder: (_) =>
                                                  FilmLibraryPlayerScreen(
                                                filmId: id,
                                                title: title,
                                              ),
                                            ),
                                          ),
                                          icon: const Icon(Icons.play_arrow),
                                          label: const Text('PLAY'),
                                        ),
                                      ),
                                      IconButton(
                                        onPressed: () => remove(id),
                                        icon: const Icon(Icons.delete_outline),
                                      ),
                                    ],
                                  ),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
          ),
        ],
      ),
    );
  }
}
''')
          PY
          dart format lib/video_generation_status_screen.dart lib/shot_cards_screen.dart lib/approved_shots_screen.dart lib/production_plan_review_screen.dart lib/film_library_screen.dart lib/smart_clip_review_screen.dart
          flutter pub get
          echo 'Running full Dart analysis before Android build...'
          dart analyze lib

      - name: Prepare Android project
        working-directory: app
        run: |
          chmod +x tools/prepare_android_host_v2590.sh
          ./tools/prepare_android_host_v2590.sh

      - name: Migrate Android V1 embedding to V2
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')

          s = manifest.read_text()
          original = s
          s = s.replace('android:name="io.flutter.app.FlutterApplication"', 'android:name="${applicationName}"')
          s = re.sub(r'\s*<meta-data\s+android:name="io\.flutter\.app\.android\.SplashScreenUntilFirstFrame"\s+android:value="true"\s*/>', '', s)
          s = re.sub(r'\s*<meta-data\s+android:name="flutterEmbedding"\s+android:value="1"\s*/>', '', s)

          if 'android:name="flutterEmbedding"' not in s:
              marker = '<application'
              start = s.find(marker)
              if start == -1:
                  raise SystemExit('No <application> element found in AndroidManifest.xml')
              end = s.find('>', start)
              if end == -1:
                  raise SystemExit('Malformed <application> element')
              s = s[:end+1] + '\n        <meta-data android:name="flutterEmbedding" android:value="2" />' + s[end+1:]

          manifest.write_text(s)
          print('AndroidManifest migrated to embedding v2' if s != original else 'AndroidManifest already uses embedding v2')

          for root in (Path('android/app/src/main/java'), Path('android/app/src/main/kotlin')):
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if p.suffix not in ('.java', '.kt'):
                      continue
                  text = p.read_text()
                  old = text
                  text = text.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                  text = text.replace('io.flutter.app.FlutterApplication', 'io.flutter.embedding.android.FlutterActivity')
                  text = re.sub(r'\s*import\s+io\.flutter\.plugins\.GeneratedPluginRegistrant\s*;?', '', text)
                  text = re.sub(r'\s*GeneratedPluginRegistrant\.registerWith\(this\);?', '', text)
                  if text != old:
                      p.write_text(text)
                      print(f'migrated {p}')
          PY
          echo 'Checking for remaining V1 embedding references:'
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build 'io\.flutter\.app\.' android; then
            echo 'ERROR: remaining Android V1 embedding reference found'
            exit 1
          fi
          echo 'No Android V1 embedding references remain.'

      - name: Build release APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-APK-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
