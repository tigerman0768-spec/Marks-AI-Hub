name: Package Marks AI Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v2590 project
        run: |
          rm -rf build
          mkdir -p build
          unzip -q Mark_s_AI_v2590_FINAL_CLOUD_BUILD.zip -d build
          test -f build/server.js
          test -f build/package.json
          test -d build/server
      - name: Patch backend with Runway video generation
        run: |
          python3 tools/patch_backend_video_generation.py
          python3 tools/test_patch_backend_video_generation.py
      - name: Verify Node backend
        working-directory: build
        run: |
          node --check server.js
          node --check server/video_generation_routes.js
          # Verify the shipped server actually mounts the tested routes and
          # that packaging did not copy a stale or different route implementation.
          test "$(grep -Fc "registerVideoGenerationRoutes(app);" server.js)" -eq 1
          grep -Fq "require('./server/video_generation_routes')" server.js
          grep -Fq "app.post('/api/video/generate'" server/video_generation_routes.js
          grep -Fq "app.get('/api/video/status/:taskId'" server/video_generation_routes.js
          cmp server/video_generation_routes.js ../tools/video_generation_routes.js
          node --check ../tools/test_video_generation_routes.js
          node --check ../tools/smoke_video_generation_backend.js
          node --check ../tools/smoke_video_generation_backend.js
          node ../tools/test_video_generation_routes.js
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const server = fs.readFileSync('server.js', 'utf8');
          assert.match(server, /require\(['"]\.\/server\/video_generation_routes['"]\)/,
            'production server imports the video-generation route module');
          assert.match(server, /registerVideoGenerationRoutes\(app\)/,
            'production server registers the video-generation routes');
          const routeAt = server.indexOf('registerVideoGenerationRoutes(app)');
          const listenAt = server.indexOf('app.listen(');
          assert.ok(routeAt >= 0 && listenAt > routeAt,
            'video routes are registered before the server starts listening');
          assert.ok(fs.existsSync('server/video_generation_routes.js'),
            'packaged server contains the route module');
          console.log('PASS: production video route registration and packaging verified');
          NODE
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p,null,2))"
          echo "Server modules: $(find server -type f -name '*.js' | wc -l)"
      - name: Test self-contained Hostinger backend
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm test
          node --check video_generation_routes.js
      - name: Package self-contained Hostinger Node.js backend
        run: |
          rm -rf marks-ai-video-backend
          mkdir marks-ai-video-backend
          cp backend/package.json backend/server.js backend/video_generation_routes.js backend/README.md marks-ai-video-backend/
          cd marks-ai-video-backend
          npm install --omit=dev --no-audit --no-fund
          cd ..
          zip -qr Marks-AI-Video-Backend-Hostinger.zip marks-ai-video-backend
      - uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-Video-Backend-Hostinger
          path: Marks-AI-Video-Backend-Hostinger.zip
      - name: Package Hostinger backend
        run: |
          rm -rf marks-ai-backend
          mkdir marks-ai-backend
          cp build/server.js build/package.json marks-ai-backend/
          cp -R build/server marks-ai-backend/
          printf '%s\n' '# Marks AI Backend - Hostinger Node.js' '' 'Start command: node server.js' '' 'Hostinger supplies the PORT environment variable.' '' 'Health check: GET /api/health' '' 'Main project API: GET/POST /api/projects' '' 'Video API: POST /api/video/generate and GET /api/video/status/:taskId' '' 'Runway secret: RUNWAYML_API_SECRET' > marks-ai-backend/README_HOSTINGER.md
          zip -qr Marks-AI-v2590-Hostinger-Backend.zip marks-ai-backend
      - uses: actions/upload-artifact@v4
        with:
          name: Marks-AI-v2590-Hostinger-Backend
          path: Marks-AI-v2590-Hostinger-Backend.zip